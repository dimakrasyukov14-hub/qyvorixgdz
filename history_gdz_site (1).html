<script>
const DATA = [{"c":1,"n":"§ 1","t":"Великое переселение народов. Восточная Европа и Северная Азия в 1-м тыс. н. э.","pg":"6–13","short":"В I тысячелетии н. э. климатические изменения, нехватка продовольствия, поиск плодородных земель и военные столкновения вызвали массовые перемещения народов по Европе и Азии. Вторжение гуннов во второй половине IV века ускорило переселение германцев и других племён. В 476 году пала Западная Римская империя; Восточная её часть сохранилась и позднее стала известна как Византия.\n\nВ ходе переселений славяне расселились на огромной территории. В VII веке выделились три ветви — западная, южная и восточная. В степях и лесостепях действовали авары, болгары, хазары и тюрки. После распада Великой Болгарии часть болгар ушла на Балканы, другая — на Волгу и Каму, где позднее возникла Волжская Булгария.","pts":["Причины переселений: похолодание, нехватка пищи, поиск новых земель, давление соседних племён и стремление к добыче.","Гунны пришли в Европу во второй половине IV века и потеснили готов; началась новая волна перемещений.","В 476 году пала Западная Римская империя. Восточная часть продолжила существование как Византия.","В VII веке оформились три ветви славян: западная, южная и восточная.","Авары, тюрки и хазары создавали каганаты; Великая Болгария распалась под ударами хазар.","Из болгарских объединений возникли Дунайская Болгария и Волжская Булгария; в расселении региона участвовали также финно-угры и балты."],"qa":[["Назовите причины массового переселения народов в I тыс. н. э.","Похолодание и нехватка продовольствия ухудшали условия жизни. Народы искали плодородные и безопасные земли; переселения также вызывали войны, давление сильных соседей и стремление к завоеваниям."],["Почему кочевники преодолевали большие территории быстрее оседлых народов?","Они передвигались верхом, имели стада и были приспособлены к длительным переходам. Им не требовалось переносить постоянные поселения и ждать урожая."],["Какое событие условно отделяет Античность от Средневековья?","Падение Западной Римской империи в 476 году. Ему предшествовали ослабление империи, внутренние кризисы и вторжения варварских племён."],["Почему Византия стала наследницей античной культуры?","Восточная Римская империя сохранила города, государственные учреждения, письменность, христианскую традицию и значительную часть греко-римского культурного наследия."],["Какие три государства назывались каганатами?","Аварский, Тюркский и Хазарский каганаты. Их объединяли власть кагана и значительная роль военной конницы."],["Расположите события по времени: вторжение гуннов, падение Западной Римской империи, разделение славян.","Сначала вторжение гуннов во второй половине IV века, затем падение Западной Римской империи в 476 году, затем оформление трёх ветвей славян в VII веке."]],"src":"Прокопий Кесарийский, «Война с готами» (VI век). Историк описывает склавинов и антов как племена без единого постоянного правителя, с общими решениями, сходными обычаями и языческими обрядами. Он сообщает об их жилищах и вооружении. Это взгляд внешнего наблюдателя; описание важно, но не обязательно одинаково характеризует все племена.","srcq":[["Кого называли склавинами и антами?","Так в источниках называли ранние группы славян; Иордан считал их родственными племенами со сходными обычаями и близким языком."],["Какие сведения об их обществе даёт Прокопий?","Он пишет об отсутствии единоличного правителя, общих решениях, языческих верованиях, жертвоприношениях, поселениях и военном снаряжении."]],"terms":[["Великое переселение народов","Массовое движение племён и народов по Европе и Азии в I тысячелетии н. э."],["Каган","Титул верховного правителя у ряда тюркских и других кочевых народов."],["Финно-угры","Народы, говорящие на языках финно-угорской ветви уральской языковой семьи."],["Балты","Народы балтийской языковой группы; предки современных литовцев и латышей."]],"dates":["II–III вв. — движение германских племён готов к Причерноморью.","Вторая половина IV в. — вторжение гуннов в Европу.","476 г. — падение Западной Римской империи.","VII в. — разделение славян на три ветви.","Начало X в. — возникновение Волжской Булгарии."],"main":"Великое переселение народов изменило население и политическую карту Европы и Азии. Оно ускорило расселение славян, формирование новых народов и государств.","id":"section-1","chapter_name":"Глава I · Государство Русь","search_text":"§ 1 великое переселение народов. восточная европа и северная азия в 1-м тыс. н. э. в i тысячелетии н. э. климатические изменения, нехватка продовольствия, поиск плодородных земель и военные столкновения вызвали массовые перемещения народов по европе и азии. вторжение гуннов во второй половине iv века ускорило переселение германцев и других племён. в 476 году пала западная римская империя; восточная её часть сохранилась и позднее стала известна как византия.\n\nв ходе переселений славяне расселились на огромной территории. в vii веке выделились три ветви — западная, южная и восточная. в степях и лесостепях действовали авары, болгары, хазары и тюрки. после распада великой болгарии часть болгар ушла на балканы, другая — на волгу и каму, где позднее возникла волжская булгария. великое переселение народов каган финно-угры балты "},{"c":1,"n":"§ 2–3","t":"Восточные славяне и их соседи","pg":"14–21","short":"В VI–IX веках восточные славяне расселялись по Восточно-Европейской равнине — от Ладоги до Причерноморья и от Карпат до верховьев Волги и Дона. Они взаимодействовали с балтами и финно-уграми: перенимали навыки хозяйства, а соседи — славянский язык и земледельческие традиции.\n\nОсновой хозяйства было земледелие, дополненное скотоводством, охотой, рыболовством, бортничеством и ремёслами. Родовая община уступала место соседской, возникали племена и союзы племён, усиливались князья и дружины. Важные вопросы могли обсуждаться на вече. Славяне сохраняли языческие верования и почитали силы природы и духов дома.","pts":["Расселение славян происходило преимущественно мирно: на огромных пространствах было сравнительно мало населения.","Главным занятием было земледелие: в лесной зоне применяли подсечно-огневой способ, в степной и лесостепной — перелог.","Развивались скотоводство, охота, рыболовство, бортничество, кузнечное и гончарное дело, ткачество и меновая торговля.","Родовая община постепенно сменилась соседской общиной — вервью или миром.","Появились князья и дружины; вече было народным собранием. Росло имущественное неравенство.","Соседями восточных славян были балты, финно-угры, хазары, булгары и другие народы."],"qa":[["Почему расселение восточных славян в основном было мирным?","Восточно-Европейская равнина была огромной, а местное население — сравнительно малочисленным. Славяне часто осваивали новые земли постепенно, взаимодействуя с соседями."],["Какие занятия составляли хозяйство восточных славян?","Земледелие, скотоводство, охота, рыболовство, бортничество, ремёсла и обмен товарами. Главным занятием было земледелие."],["Чем различались подсечно-огневое земледелие и перелог?","При подсеке участок расчищали от леса, сжигали деревья, а после истощения почвы переходили на новое место. При перелоге поле периодически оставляли отдыхать, чтобы почва восстановилась."],["Как менялось общество восточных славян?","На смену родовой общине, основанной на родстве, постепенно пришла соседская община. Возникали племена и союзы племён, усиливались княжеская власть и дружина, росло имущественное неравенство."],["Почему реки и леса были важны для славян?","Реки давали воду, рыбу и транспортные пути. Леса обеспечивали древесину, дичь, мёд, пушнину и защиту."],["Чем управление славян напоминало управление в греческих полисах?","В обоих случаях существовали коллективные собрания для обсуждения важных вопросов, хотя их устройство и полномочия различались."]],"src":"М. Валенцова, «Славянская демонология» (статья о домовом). Домовой представлен как дух-хранитель жилища, очага, семьи и домашнего благополучия. Верили, что он следит за порядком в доме. Источник помогает понять бытовую сторону славянских языческих верований; это реконструкция представлений по фольклорным и этнографическим материалам.","srcq":[["Что, по поверьям, охранял домовой?","Дом, очаг, семью, имущество и благополучие людей и скота."],["Что источник говорит о мировоззрении славян?","Повседневная жизнь связывалась с миром духов и сил природы; домашний порядок считался условием семейного благополучия."]],"terms":[["Вервь (мир)","Соседская территориальная община восточных славян."],["Подсечно-огневое земледелие","Обработка участка после подрубки, высушивания и сжигания деревьев; зола служила удобрением."],["Перелог","Система земледелия, при которой участку давали время восстановить плодородие."],["Бортничество","Сбор мёда диких пчёл из естественных дупел — бортей."],["Князь","Вождь и правитель, руководивший племенем или землёй."],["Дружина","Вооружённое окружение князя, его военная и административная опора."],["Вече","Народное собрание для обсуждения важных дел."]],"dates":["VI в. — активное расселение восточных славян по Восточно-Европейской равнине.","VII–IX вв. — развитие хозяйства и общественного устройства восточных славян."],"main":"К VII–IX векам восточные славяне освоили обширные пространства, развивали земледелие, промыслы и ремёсла. Переход к соседской общине и появление князей, дружин и вечевых собраний показывают усложнение общественной жизни.","outline":[{"num":1,"title":"Заселение славянами Восточно-Европейской равнины","text":"С VI века восточные славяне активно осваивали лесную и лесостепную части Восточной Европы. Их расселение в основном проходило мирно: территория была огромной, а местное население — сравнительно малочисленным. Славяне заняли пространство от Ладожского озера на севере до Причерноморских степей на юге, от Карпат на западе до верховьев Волги и Дона на востоке. Они постепенно смешивались с частью финно-угорских и балтских народов: соседи перенимали земледелие, язык и обычаи славян, а славяне — навыки охоты, рыболовства и особенности жилища. Некоторые финно-угорские племена сохраняли самостоятельность и платили дань."},{"num":2,"title":"Хозяйство восточных славян","text":"Восточные славяне вели натуральное хозяйство: продукты и вещи в основном производили для своей семьи и общины. Главным занятием было земледелие. В лесной зоне использовали подсечно-огневой способ: деревья подрубали, высушивали и сжигали, а зола удобряла почву; когда земля истощалась, переходили на новый участок. В степях и лесостепях применяли перелог — давали полю отдохнуть и восстановить плодородие. Выращивали рожь, пшеницу, ячмень, просо, лён и овощи, разводили скот. Важными промыслами были охота, рыболовство и бортничество, а среди ремёсел — ткачество, кузнечное и гончарное дело. Излишки обменивали с соседями; реки и леса давали пищу, сырьё и пути сообщения."},{"num":3,"title":"Устройство общества","text":"Сначала важнейшей формой объединения была родовая община: родственники совместно владели землёй и работали под руководством старейшины. Железные орудия повышали урожайность, появлялись излишки, и отдельные семьи могли вести хозяйство самостоятельно. Поэтому постепенно родовую общину сменила соседская, или территориальная; у восточных славян её называли вервью или миром. Несколько общин объединялись в племена и союзы племён. Со временем усилилось имущественное неравенство, появились зависимые люди и князья. При князе собиралась дружина — вооружённая опора власти, которая защищала землю и поддерживала порядок. Важные вопросы могли обсуждаться на вече, а споры решались по обычному праву."},{"num":4,"title":"Верования восточных славян","text":"Восточные славяне придерживались традиционных языческих верований и поклонялись многим богам. Их представления о мире отражались в мифах и обрядах. Специальные места для религиозных церемоний назывались капищами; там ставили деревянных или каменных идолов. Многие божества олицетворяли природные силы: Перун считался богом грома и молнии и покровителем князя и дружины, Стрибог — повелителем ветра, Дажьбог — богом Солнца и плодородия, Велес — покровителем скота, Мокошь — богиней плодородия и домашних работ. Славяне почитали предков и верили в загробную жизнь. Обрядами и гаданиями занимались волхвы."},{"num":5,"title":"Восточные славяне и хазары","text":"С конца VII века и до 960-х годов в Прикаспийских степях существовал Хазарский каганат. Его столицей в IX–X веках был Итиль в низовьях Волги. Хазары занимались кочевым скотоводством, но большие доходы получали от международной торговли; государством правил каган. Иудаизм приняли правитель и знать, в городах жили также мусульмане и христиане, а большинство населения сохраняло многобожие. Часть восточнославянских племён платила хазарам дань. Вместе с тем контроль хазар над торговыми путями помогал поддерживать обмен: к славянам попадали восточные товары и арабские серебряные монеты — дирхемы."},{"num":6,"title":"Восточные славяне и варяги","text":"С VII века в земли восточных славян и финно-угров приходили выходцы из Скандинавии. В Европе их называли норманнами или викингами, а в древнерусских летописях — варягами. Они торговали и искали военную добычу. Славяне обменивали на привозные товары продовольствие, меха, воск, мёд и другие продукты. Варяги осваивали речные пути: путь «из варяг в греки» связывал Балтийское и Чёрное моря и вёл к Константинополю, а Волжский путь проходил через земли булгар к Хазарии и далее к Каспийскому морю и владениям арабов. Для торговли важны были волоки — участки суши, по которым ладьи перетаскивали между реками."}],"id":"section-2","chapter_name":"Глава I · Государство Русь","search_text":"§ 2–3 восточные славяне и их соседи в vi–ix веках восточные славяне расселялись по восточно-европейской равнине — от ладоги до причерноморья и от карпат до верховьев волги и дона. они взаимодействовали с балтами и финно-уграми: перенимали навыки хозяйства, а соседи — славянский язык и земледельческие традиции.\n\nосновой хозяйства было земледелие, дополненное скотоводством, охотой, рыболовством, бортничеством и ремёслами. родовая община уступала место соседской, возникали племена и союзы племён, усиливались князья и дружины. важные вопросы могли обсуждаться на вече. славяне сохраняли языческие верования и почитали силы природы и духов дома. вервь (мир) подсечно-огневое земледелие перелог бортничество князь дружина вече заселение славянами восточно-европейской равнины хозяйство восточных славян устройство общества верования восточных славян восточные славяне и хазары восточные славяне и варяги"},{"c":1,"n":"§ 4","t":"Начало династии Рюриковичей","pg":"22–27","short":"По летописному преданию, в 862 году новгородцы пригласили варяжского князя Рюрика и его братьев, чтобы прекратить усобицы и установить порядок. После смерти братьев Рюрик сосредоточил власть и распределил города между приближёнными. В 879 году он умер, оставив малолетнего сына Игоря под опекой Олега.\n\nВ 882 году Олег захватил Киев и объединил под своей властью северные и южные центры Руси. Киев стал важнейшим политическим центром. Русь контролировала часть торгового пути «из варяг в греки», связывавшего Балтику с Чёрным морем. Олег укреплял власть, собирал дань и заключал договоры с Византией.","pts":["Летописная дата призвания Рюрика — 862 год; она считается традиционной датой начала правления династии Рюриковичей.","После смерти Рюрика власть перешла к Олегу, опекуну малолетнего Игоря.","В 882 году Олег овладел Киевом и объединил важнейшие центры Руси.","Киев был выгоден благодаря расположению на торговом пути «из варяг в греки».","Олег совершал походы на Византию и заключил договоры 907 и 911 годов.","История призвания варягов известна прежде всего по летописи; роль скандинавов и местного населения обсуждается в исторической науке."],"qa":[["Что рассказывает летопись о призвании Рюрика?","Согласно «Повести временных лет», в 862 году представители северных племён пригласили варягов княжить, чтобы прекратить внутренние распри. Рюрик стал править на севере, его братья получили другие центры."],["В чём заключался спор норманистов и антинорманистов?","Норманисты подчёркивали роль выходцев из Скандинавии в возникновении княжеской власти. Антинорманисты считали, что государственность развивалась прежде всего благодаря местным народам. Современный взгляд учитывает взаимодействие разных факторов."],["Почему Олег перенёс центр власти в Киев?","Киев имел выгодное положение на Днепре, позволял контролировать путь к Чёрному морю и Византии и объединять северные и южные земли."],["Какую роль сыграли договоры Олега с Византией?","Они закрепили условия торговли и пребывания русских купцов в Константинополе, определяли дипломатические отношения и подтверждали военную силу Руси."],["Что такое полюдье?","Объезд князем и дружиной подвластных земель для сбора дани. Порядок сбора дани в ранний период ещё не был единообразным и нередко вызывал конфликты."]],"src":"«Повесть временных лет» о Рюрике и распределении городов. Летописный текст сообщает, что после смерти Синеуса и Трувора Рюрик принял всю власть и раздал города своим мужам. Названы словене, кривичи, меря, весь и мурома. Источник подчёркивает связь ранней княжеской власти с контролем над городами и разными населениями. Летопись записана позднее событий, поэтому сведения сопоставляют с археологией и другими источниками.","srcq":[["Какие города и народы названы в отрывке?","Упомянуты Полоцк, Ростов, Белоозеро и Муром; с ними связаны кривичи, меря, весь и мурома, а в Новгороде жили словене."],["Как летописец показывает власть Рюрика?","Он представлен как верховный правитель, распределяющий города между приближёнными и управляющий разными общинами."]],"terms":[["Полюдье","Объезд князем и дружиной подвластных земель для сбора дани."],["Династия","Последовательность правителей из одного рода."],["Торговый путь «из варяг в греки»","Водный маршрут от Балтийского моря через реки и волоки к Чёрному морю и Византии."]],"dates":["862 г. — летописное призвание Рюрика.","879 г. — смерть Рюрика; власть перешла к Олегу как опекуну Игоря.","882 г. — захват Олегом Киева и объединение северных и южных центров Руси.","907 и 911 гг. — походы и договоры Руси с Византией при Олеге."],"main":"Объединение Новгорода и Киева при Олеге в 882 году создало основу раннего государства Русь. Контроль торговых путей, сбор дани и договоры с Византией укрепляли княжескую власть.","id":"section-3","chapter_name":"Глава I · Государство Русь","search_text":"§ 4 начало династии рюриковичей по летописному преданию, в 862 году новгородцы пригласили варяжского князя рюрика и его братьев, чтобы прекратить усобицы и установить порядок. после смерти братьев рюрик сосредоточил власть и распределил города между приближёнными. в 879 году он умер, оставив малолетнего сына игоря под опекой олега.\n\nв 882 году олег захватил киев и объединил под своей властью северные и южные центры руси. киев стал важнейшим политическим центром. русь контролировала часть торгового пути «из варяг в греки», связывавшего балтику с чёрным морем. олег укреплял власть, собирал дань и заключал договоры с византией. полюдье династия торговый путь «из варяг в греки» "},{"c":1,"n":"§ 5–6","t":"Русь при Игоре, Ольге, Святославе","pg":"28–34","short":"После Олега княжил Игорь. Он продолжал походы и договорную политику с Византией, но попытка повторно собрать дань с древлян в 945 году закончилась его гибелью. Княгиня Ольга подавила восстание древлян и изменила систему сбора дани: установила уроки — фиксированные размеры выплат, и погосты — места сбора дани и управления.\n\nСвятослав прославился как воин и полководец. В 964–966 годах он разгромил Хазарский каганат и воевал в Поволжье и на Северном Кавказе. Затем перенёс внимание на Балканы и вступил в конфликт с Византией. В 972 году Святослав погиб при возвращении из похода.","pts":["Игорь продолжил сбор дани и внешнюю политику предшественников; его гибель в 945 году показала опасность произвольных поборов.","Ольга подавила восстание древлян и провела налоговую реформу, упорядочив дань.","Уроки фиксировали размер дани, погосты становились местами её сбора и административного контроля.","Святослав был князем-воином; основные направления походов — Хазария, Поволжье, Северный Кавказ и Балканы.","Разгром Хазарского каганата ослабил прежнего соперника Руси и изменил баланс сил на торговых путях.","Святослав погиб в 972 году; его длительное отсутствие в походах создавало напряжение внутри страны."],"qa":[["Почему погиб Игорь?","В 945 году он попытался повторно собрать дань с древлян после обычного сбора. Древляне сочли это чрезмерным побором, восстали и убили князя."],["В чём состояла реформа Ольги?","Она установила уроки — заранее определённые размеры дани, и погосты — пункты, куда население привозило выплаты. Это сделало сбор дани более упорядоченным и ограничило произвол сборщиков."],["Почему Ольгу считают важной правительницей?","Она укрепила управление Русью, упорядочила налогообложение и установила дипломатические контакты с Византией. Позднее её почитали как христианскую святую."],["Почему Святослав считается выдающимся полководцем?","Он проводил стремительные дальние походы и нанёс поражение Хазарскому каганату, изменив расстановку сил в Восточной Европе."],["Каковы последствия разгрома Хазарского каганата?","Хазария утратила прежнее могущество, Русь усилила влияние на Волге и в степном пограничье. Обстановка на торговых путях изменилась и открыла пространство для новых кочевых сил."]],"src":"Лев Диакон, «История» (X век), описание Святослава. Византийский историк описывает внешний облик князя, его простую одежду, причёску и привычку грести в ладье вместе с дружинниками. Портрет подчёркивает выносливость и близость князя к воинам. Это наблюдение иностранного автора, оно передаёт впечатление византийцев.","srcq":[["Как Лев Диакон характеризует Святослава?","Как физически крепкого и выносливого воина, который не отделял себя от дружины и участвовал в походной жизни."],["Почему описание полезно историку?","Оно даёт представление о внешности, одежде и военных обычаях князя, а также показывает, каким его видели современники за пределами Руси."]],"terms":[["Уроки","Заранее установленные размеры дани, введённые княгиней Ольгой."],["Погосты","Места сбора дани и административные пункты."],["Дань","Обязательные выплаты подвластного населения князю или государству."]],"dates":["945 г. — гибель князя Игоря во время сбора дани с древлян.","945–960-е гг. — правление Ольги в период малолетства Святослава.","964–966 гг. — походы Святослава против Хазарского каганата и его союзников.","972 г. — гибель Святослава."],"main":"Правление Игоря, Ольги и Святослава укрепило Русь, но выявило разные стороны ранней государственности: необходимость упорядоченного сбора дани, развитие управления и активную внешнюю политику.","id":"section-4","chapter_name":"Глава I · Государство Русь","search_text":"§ 5–6 русь при игоре, ольге, святославе после олега княжил игорь. он продолжал походы и договорную политику с византией, но попытка повторно собрать дань с древлян в 945 году закончилась его гибелью. княгиня ольга подавила восстание древлян и изменила систему сбора дани: установила уроки — фиксированные размеры выплат, и погосты — места сбора дани и управления.\n\nсвятослав прославился как воин и полководец. в 964–966 годах он разгромил хазарский каганат и воевал в поволжье и на северном кавказе. затем перенёс внимание на балканы и вступил в конфликт с византией. в 972 году святослав погиб при возвращении из похода. уроки погосты дань "},{"c":1,"n":"§ 7–8","t":"Русь при Владимире Святом","pg":"35–42","short":"Владимир Святославич пришёл к власти после борьбы между сыновьями Святослава. Он укрепил княжеское управление, рассадил сыновей и наместников по важным городам, усилил оборону южных рубежей. В 980 году провёл религиозную реформу, пытаясь объединить языческие культы, но она не решила задачу единства.\n\nВ 988 году Владимир принял христианство по византийскому обряду, а затем началось крещение Руси. Новая вера укрепляла международные связи с Византией, способствовала распространению письменности, храмового строительства и книжной культуры. Христианизация населения проходила постепенно и не сразу вытеснила прежние обычаи.","pts":["Владимир победил в борьбе за власть и стал единовластным князем; укреплял границы и систему управления.","В 980 году была предпринята попытка объединить языческие культы вокруг Перуна и других богов.","В 988 году Владимир принял христианство и начал крещение Руси.","Христианство пришло из Византии и сблизило Русь с христианским миром Европы.","Развивались церковная организация, письменность, образование, каменное зодчество и книжность.","Языческие обычаи и народные представления сохранялись ещё долго."],"qa":[["Какие меры Владимир предпринял для укрепления государства?","Он усилил княжескую власть, назначал сыновей и доверенных людей в ключевые города, укреплял южные рубежи и стремился создать общую религиозную основу."],["Почему языческая реформа 980 года не решила проблему единства?","Местные племена сохраняли свои традиции, а пантеон богов не создавал единой универсальной религии, способной связать Русь с влиятельными соседями."],["Почему Владимир выбрал христианство византийского обряда?","Византия была сильным и культурно развитым соседом; христианство давало Руси дипломатические связи, престиж и общую религиозную систему. Летопись также подчёркивает впечатление послов от византийского богослужения."],["Как крещение повлияло на развитие Руси?","Оно укрепило международное положение, способствовало развитию письменности, книжного дела, образования, церковной архитектуры, живописи и права."],["Что означает десятина?","Десятина — отчисление десятой части доходов на церковные нужды. На Руси её установление связано с организацией церкви после крещения."],["Как называлась крупная территориальная единица со стольным городом?","Княжество или земля; её главным центром был стольный город, где находился княжеский престол и управление."]],"src":"«Повесть временных лет» о выборе веры (летописный рассказ о посольстве 987 года). Послы Владимира рассказывают о поездке в Византию и впечатлении от богослужения в храме Святой Софии. Источник показывает, что учитывались не только религиозные идеи, но и красота обряда, политические связи и престиж. Летописный рассказ содержит литературные элементы, поэтому это не дословный протокол переговоров.","srcq":[["Что особенно поразило послов в Византии?","Красота и торжественность богослужения: послы говорили, что не понимали, находятся ли они на земле или на небе."],["Какие причины выбора веры можно увидеть в источнике?","Религиозное впечатление и культурный авторитет Византии; в более широком контексте — дипломатические и политические выгоды."]],"terms":[["Десятина","Десятая часть доходов, направлявшаяся на содержание церкви."],["Митрополия","Церковная область, возглавляемая митрополитом."],["Христианизация","Распространение христианства и церковной организации среди населения."]],"dates":["980 г. — языческая религиозная реформа Владимира.","987 г. — летописный рассказ о посольстве и выборе веры.","988 г. — Крещение Руси.","980–1015 гг. — княжение Владимира Святославича."],"main":"Крещение Руси в 988 году укрепило власть князя и международные связи государства, а также стало основой культурных перемен: распространения письменности, образования, храмового искусства и книжной традиции.","id":"section-5","chapter_name":"Глава I · Государство Русь","search_text":"§ 7–8 русь при владимире святом владимир святославич пришёл к власти после борьбы между сыновьями святослава. он укрепил княжеское управление, рассадил сыновей и наместников по важным городам, усилил оборону южных рубежей. в 980 году провёл религиозную реформу, пытаясь объединить языческие культы, но она не решила задачу единства.\n\nв 988 году владимир принял христианство по византийскому обряду, а затем началось крещение руси. новая вера укрепляла международные связи с византией, способствовала распространению письменности, храмового строительства и книжной культуры. христианизация населения проходила постепенно и не сразу вытеснила прежние обычаи. десятина митрополия христианизация "},{"c":1,"n":"§ 9","t":"Расцвет Руси при Ярославе Мудром","pg":"43–49","short":"После смерти Владимира Святославича между его сыновьями развернулась борьба за власть. Победителем стал Ярослав, княживший в Киеве с 1019 по 1054 год. При нём Русь укрепила международный авторитет, расширила династические связи с европейскими государствами и разгромила печенегов в 1036 году.\n\nЯрослав поддерживал развитие христианства, письменности и образования. При нём строились Софийские соборы, развивалась книжность. Важным правовым памятником стала «Правда Ярослава» — ранняя часть «Русской Правды», регулирующая наказания и имущественные отношения.","pts":["После смерти Владимира его сыновья боролись за киевский престол; Ярослав утвердился как великий князь в 1019 году.","Ярослав укреплял границы и внешние связи Руси, заключал династические браки с европейскими домами.","В 1036 году печенеги потерпели поражение под Киевом, что ослабило угрозу столице.","«Русская Правда» регулировала наказания, штрафы и имущественные отношения; она ограничивала кровную месть и укрепляла княжеский суд.","Строительство Софийского собора и развитие книжности свидетельствовали о культурном подъёме.","Митрополит Иларион прославился как церковный писатель; его «Слово о законе и благодати» осмысливало место Руси в христианском мире."],"qa":[["Почему после смерти Владимира началась борьба между его сыновьями?","Не существовало единого бесспорного порядка наследования верховной власти; каждый претендовал на старшинство и контроль над Киевом и землями."],["Что такое «Русская Правда» и почему она важна?","Это древнерусский сборник правовых норм. Он устанавливал штрафы за преступления, защищал имущество и порядок, фиксировал социальные различия и постепенно вытеснял кровную месть денежными взысканиями."],["Какое значение имела победа над печенегами в 1036 году?","Она сняла непосредственную угрозу Киеву, укрепила безопасность южных рубежей и престиж княжеской власти."],["Почему Ярослава называют Мудрым?","За укрепление государства и международных связей, поддержку закона, образования, книжности и церковного строительства."],["Какую роль сыграл митрополит Иларион?","Он был выдающимся церковным писателем и мыслителем. В «Слове о законе и благодати» осмыслил место Руси в христианском мире и прославил её крещение."]],"src":"«Правда Ярослава» — древнерусский правовой памятник. В статьях говорится о кровной мести и денежных выплатах за убийство, а также о телесных повреждениях. Источник показывает стремление ограничить самосуд, установить меру ответственности и укрепить княжеский суд.","srcq":[["Что говорит источник о кровной мести?","Родственникам убитого разрешалось мстить в определённых случаях, но при отказе от мести устанавливалась выплата князю. Это отражает переход от обычая мести к правовому урегулированию."],["Какова главная задача этих норм?","Поддержание общественного порядка, защита личности и имущества и ограничение бесконтрольного насилия."]],"terms":[["Русская Правда","Сборник правовых норм Древней Руси."],["Вира","Денежный штраф за убийство, выплачивавшийся в пользу князя."],["Митрополит","Высший церковный руководитель крупной области в православной церкви."]],"dates":["1016–1018 гг. — борьба Ярослава со Святополком.","1019–1054 гг. — княжение Ярослава Мудрого в Киеве.","1036 г. — разгром печенегов под Киевом.","1054 г. — смерть Ярослава Мудрого."],"main":"При Ярославе Мудром Русь достигла политического и культурного подъёма. Международные связи, победа над печенегами, «Русская Правда», церковное строительство и книжность укрепляли авторитет государства.","id":"section-6","chapter_name":"Глава I · Государство Русь","search_text":"§ 9 расцвет руси при ярославе мудром после смерти владимира святославича между его сыновьями развернулась борьба за власть. победителем стал ярослав, княживший в киеве с 1019 по 1054 год. при нём русь укрепила международный авторитет, расширила династические связи с европейскими государствами и разгромила печенегов в 1036 году.\n\nярослав поддерживал развитие христианства, письменности и образования. при нём строились софийские соборы, развивалась книжность. важным правовым памятником стала «правда ярослава» — ранняя часть «русской правды», регулирующая наказания и имущественные отношения. русская правда вира митрополит "},{"c":1,"n":"§ 10–11","t":"Наследники Ярослава Мудрого","pg":"50–55","short":"Ярослав Мудрый завещал сыновьям распределить земли и поддерживать согласие, но после его смерти между князьями начались конфликты. Для согласования отношений князья собирались на съезды. В 1097 году Любечский съезд провозгласил принцип «каждый да держит отчину свою», пытаясь прекратить усобицы, но противоречия не исчезли.\n\nПоловцы регулярно нападали на южные рубежи Руси, а княжеские распри мешали организовать общую оборону. В обществе усиливалось социальное расслоение: выделялись бояре и землевладельцы, зависимые категории населения — смерды, закупы, рядовичи и холопы. «Правда Ярославичей» дополнила правовые нормы и защищала княжеское хозяйство.","pts":["Завещание Ярослава распределило владения между сыновьями и призывало их к согласию.","Система старшинства и борьба за Киев вызывали постоянные княжеские конфликты.","Любечский съезд 1097 года закрепил принцип наследственного владения отчиной.","Усобицы ослабляли оборону от половцев и нарушали торговлю и хозяйственную жизнь.","«Правда Ярославичей» уделяла особое внимание охране княжеского хозяйства и людей.","Свободные общинники, зависимые люди, дружинники, бояре, ремесленники и холопы имели разный правовой статус."],"qa":[["Почему княжеские усобицы продолжались после съездов?","Князья стремились получить Киев и расширить владения; решения съездов не имели достаточно сильного механизма исполнения, а наследственные споры и местные интересы сохранялись."],["Какое решение принял Любечский съезд 1097 года?","Был провозглашён принцип «каждый да держит отчину свою»: князья должны были владеть наследственными землями и не отнимать их друг у друга."],["Почему усобицы были опасны для Руси?","Они ослабляли совместную оборону от половцев, разоряли земли, мешали торговле и уменьшали авторитет княжеской власти."],["Чем «Правда Ярославичей» отличалась от «Правды Ярослава»?","Она была дополнением, принятым сыновьями Ярослава, и уделяла больше внимания охране княжеского хозяйства и людей, устанавливая повышенные штрафы."],["Кто такие смерды, закупы, рядовичи и холопы?","Смерды — сельское население; закупы — люди, отрабатывавшие долг («купу»); рядовичи — зависимые по договору («ряду»); холопы — наиболее несвободные люди, близкие по положению к рабам."]],"src":"«Повесть временных лет» о наставлении Ярослава сыновьям. Летопись передаёт призыв жить в любви и согласии, потому что вражда приведёт к гибели и разорению земли. Источник показывает, что князь понимал опасность раздоров и пытался установить правило мирного наследования. Позднейшие усобицы показывают, что нравственного призыва оказалось недостаточно.","srcq":[["Какую мысль Ярослав передаёт сыновьям?","Сохранять братское согласие и не враждовать друг с другом: единство укрепляет страну, а распри делают её уязвимой."],["Насколько действенным оказалось наставление?","Оно не предотвратило усобицы: интересы князей и борьба за власть оказались сильнее завещания."]],"terms":[["Отчина","Земельное владение, полученное по наследству от отца или предков."],["Бояре","Знатные и влиятельные землевладельцы и советники князя."],["Смерды","Сельские жители, занимавшие особое положение в древнерусском обществе."],["Закупы","Зависимые люди, отрабатывавшие полученную «купу» — долг."],["Рядовичи","Люди, попавшие в зависимость на основании договора-ряда."],["Холопы","Наиболее несвободная категория населения."]],"dates":["1072 г. — принятие «Правды Ярославичей». ","1097 г. — Любечский съезд князей.","XI — начало XII в. — усиление княжеских усобиц и половецкой угрозы."],"main":"После смерти Ярослава Мудрого единство Руси ослабевало из-за усобиц и борьбы за Киев. Княжеские съезды и правовые дополнения пытались сохранить порядок, но не устранили политические противоречия.","id":"section-7","chapter_name":"Глава I · Государство Русь","search_text":"§ 10–11 наследники ярослава мудрого ярослав мудрый завещал сыновьям распределить земли и поддерживать согласие, но после его смерти между князьями начались конфликты. для согласования отношений князья собирались на съезды. в 1097 году любечский съезд провозгласил принцип «каждый да держит отчину свою», пытаясь прекратить усобицы, но противоречия не исчезли.\n\nполовцы регулярно нападали на южные рубежи руси, а княжеские распри мешали организовать общую оборону. в обществе усиливалось социальное расслоение: выделялись бояре и землевладельцы, зависимые категории населения — смерды, закупы, рядовичи и холопы. «правда ярославичей» дополнила правовые нормы и защищала княжеское хозяйство. отчина бояре смерды закупы рядовичи холопы "},{"c":1,"n":"§ 12","t":"Русь при Владимире Мономахе","pg":"56–62","short":"Владимир Мономах приобрёл авторитет как князь и организатор походов против половцев. В 1111 году объединённые силы русских князей нанесли половцам крупное поражение. После восстания в Киеве в 1113 году Мономаха пригласили на княжение. Он правил в Киеве в 1113–1125 годах и сумел временно укрепить единство Руси.\n\nМономах стремился ограничить злоупотребления ростовщиков и смягчить положение должников. В «Поучении детям» он призывал к справедливости, милосердию, уважению к старшим, защите слабых и трудолюбию. Его правление стало последним периодом заметного единства перед новым усилением раздробленности.","pts":["Мономах прославился походами против половцев и умением объединять князей.","В 1111 году состоялся большой совместный поход русских князей против половцев.","В 1113 году после киевского восстания Мономах был приглашён на престол.","Он ограничивал чрезмерные проценты по долгам и стремился защищать должников.","«Поучение детям» отражает княжеские идеалы справедливости, гостеприимства, милосердия и личной ответственности.","После смерти Мономаха в 1125 году политическое единство Руси вновь стало ослабевать."],"qa":[["Почему Владимира Мономаха пригласили княжить в Киеве в 1113 году?","После восстания горожан требовался авторитетный князь, способный восстановить порядок и ограничить злоупотребления ростовщиков. Мономах имел военную славу и поддержку части князей и знати."],["Какую роль сыграл поход 1111 года?","Он стал примером совместных действий русских князей и нанёс половцам крупное поражение, временно уменьшив угрозу южным землям."],["Какие меры Мономах предпринял против ростовщиков?","Он поддержал ограничения чрезмерных процентов и упорядочение долговых обязательств, стремясь не допустить превращения должников в полностью зависимых людей."],["Какие нравственные идеи изложены в «Поучении детям»?","Не убивать без суда, уважать старших, помогать бедным, принимать гостей, посещать больных, быть трудолюбивым."],["Почему правление Мономаха считают последним периодом укрепления единства Руси?","Авторитет князя позволял ему координировать действия других князей, сдерживать усобицы и организовывать общую оборону. После его смерти противоречия вновь усилились."]],"src":"Владимир Мономах, «Поучение детям». Князь наставляет не убивать без законного решения, уважать старших, заботиться о бедных, принимать гостей, навещать больных и не лениться. Это источник по политической культуре и нравственным идеалам княжеской среды: власть понималась не только как военная сила, но и как ответственность за подданных.","srcq":[["Какие обязанности князя подчёркивает Мономах?","Быть справедливым, защищать людей, избегать бессудных расправ, заботиться о нуждающихся и лично исполнять обязанности правителя."],["Что в тексте отражает христианскую этику?","Милосердие, гостеприимство, помощь бедным и больным, уважение к ближнему и запрет бессудного убийства."]],"terms":[["Ростовщики","Люди, дававшие деньги в долг под проценты."],["Купа","Долг или ссуда, из-за которой человек мог попасть в зависимость."],["Поучение","Наставление, обращённое к детям и потомкам; в данном случае — произведение Владимира Мономаха."]],"dates":["1111 г. — крупный поход русских князей против половцев.","1113 г. — восстание в Киеве и приглашение Владимира Мономаха на княжение.","1113–1125 гг. — княжение Владимира Мономаха в Киеве.","1125 г. — смерть Мономаха."],"main":"Владимир Мономах временно укрепил единство Руси, организовал успешные походы против половцев и стремился смягчить социальные противоречия. Его «Поучение детям» стало важным памятником древнерусской литературы и политической мысли.","id":"section-8","chapter_name":"Глава I · Государство Русь","search_text":"§ 12 русь при владимире мономахе владимир мономах приобрёл авторитет как князь и организатор походов против половцев. в 1111 году объединённые силы русских князей нанесли половцам крупное поражение. после восстания в киеве в 1113 году мономаха пригласили на княжение. он правил в киеве в 1113–1125 годах и сумел временно укрепить единство руси.\n\nмономах стремился ограничить злоупотребления ростовщиков и смягчить положение должников. в «поучении детям» он призывал к справедливости, милосердию, уважению к старшим, защите слабых и трудолюбию. его правление стало последним периодом заметного единства перед новым усилением раздробленности. ростовщики купа поучение "},{"c":2,"n":"§ 13","t":"Распад государства Русь","pg":"66–70","short":"После смерти Владимира Мономаха и его сына Мстислава Великого единая княжеская власть ослабла. Мстислав умер в 1132 году; после этого межкняжеские конфликты усилились, а крупные земли всё больше обособлялись. Начался период политической раздробленности, когда существовало несколько самостоятельных центров силы.\n\nПричинами раздробленности были рост местных княжеских династий, укрепление городов и боярства, натуральный характер хозяйства и большие расстояния между землями. Раздробленность имела двойственные последствия: местные центры развивали хозяйство и культуру, но Русь теряла способность быстро объединять силы против внешних врагов.","pts":["После смерти Мстислава Великого в 1132 году единая власть окончательно ослабла.","Княжества имели собственные династии, войска, управление и местные политические интересы.","Натуральное хозяйство означало, что продукция в основном производилась для собственного потребления; экономические связи между землями были ограничены.","Рост городов и местной знати укреплял самостоятельность отдельных земель.","Положительные стороны: развитие местного хозяйства, городов, архитектуры и культурных центров.","Отрицательные стороны: усобицы, ослабление общей обороны, затруднения торговли и неспособность быстро организовать сопротивление внешней угрозе."],"qa":[["Почему 1132 год считают важной датой начала раздробленности?","В этом году умер Мстислав Великий, последний князь, которому удавалось в значительной степени сохранять единство Руси. После его смерти усобицы усилились."],["Как натуральное хозяйство способствовало раздробленности?","Княжества в значительной степени обеспечивали себя сами и меньше зависели от обмена с другими землями. Это снижало экономическую заинтересованность в едином политическом центре."],["Назовите положительные последствия раздробленности.","Развитие местных центров, городов, ремёсел, архитектуры и региональных культурных традиций."],["Назовите отрицательные последствия раздробленности.","Княжеские усобицы, разрушение земель, ослабление общего войска и обороны, ухудшение способности противостоять внешним завоевателям."],["Почему раздробленность была закономерным этапом развития?","Местные княжеские династии, города и хозяйство укреплялись, отдельные земли получали собственные ресурсы и интересы. Слабые механизмы центральной власти не могли удержать их в едином государстве."]],"src":"Н. Карамзин, «История государства Российского» о Мстиславе Великом. Карамзин высоко оценивает Мстислава как правителя, умевшего сохранять внутренний порядок, и предполагает, что при более долгой жизни князь мог бы надолго укрепить спокойствие страны. Это оценка историка XIX века, а не свидетельство современника; причины раздробленности были шире.","srcq":[["Когда умер Мстислав Великий?","В 1132 году."],["Какой период начался после его смерти?","Период политической раздробленности Руси, когда отдельные княжества становились самостоятельными центрами власти."]],"terms":[["Политическая раздробленность","Состояние, при котором единое государство распадается на самостоятельные или почти самостоятельные земли и княжества."],["Натуральное хозяйство","Хозяйство, в котором продукты в основном производят для собственного потребления, а не для продажи."],["Удельное княжество","Земля, которой управлял отдельный князь из династии Рюриковичей."]],"dates":["1132 г. — смерть Мстислава Великого; усиление политической раздробленности.","XII–XIII вв. — расцвет самостоятельных русских земель и княжеств."],"main":"Распад единой Руси был вызван ростом местных политических и хозяйственных центров, натуральным характером экономики и ослаблением центральной власти. Раздробленность способствовала региональному развитию, но ослабляла общую оборону.","id":"section-9","chapter_name":"Глава II · Русские земли и княжества","search_text":"§ 13 распад государства русь после смерти владимира мономаха и его сына мстислава великого единая княжеская власть ослабла. мстислав умер в 1132 году; после этого межкняжеские конфликты усилились, а крупные земли всё больше обособлялись. начался период политической раздробленности, когда существовало несколько самостоятельных центров силы.\n\nпричинами раздробленности были рост местных княжеских династий, укрепление городов и боярства, натуральный характер хозяйства и большие расстояния между землями. раздробленность имела двойственные последствия: местные центры развивали хозяйство и культуру, но русь теряла способность быстро объединять силы против внешних врагов. политическая раздробленность натуральное хозяйство удельное княжество "},{"c":2,"n":"§ 14–15","t":"Владимиро-Суздальская земля","pg":"71–78","short":"Владимиро-Суздальская земля стала одним из сильнейших центров Северо-Восточной Руси. Её развитию способствовали плодородные участки ополья, речные пути, приток населения из южных районов и основание новых городов. Юрий Долгорукий укреплял Ростово-Суздальскую землю и расширял сеть городов; первое летописное упоминание Москвы относится к 1147 году.\n\nАндрей Боголюбский перенёс политический центр во Владимир и стремился усилить собственную власть. В 1169 году его войска взяли Киев, но князь не стал постоянно жить в нём. При Всеволоде Большое Гнездо княжество достигло значительного могущества, опираясь на города, боярство и княжеское управление.","pts":["Северо-Восточная Русь привлекала переселенцев относительной защищённостью, лесами, реками и плодородными землями ополья.","Юрий Долгорукий расширял и укреплял города; Москва впервые упомянута в летописи в 1147 году.","Андрей Боголюбский перенёс центр княжества во Владимир, развивал его как политическую и религиозную столицу.","В 1169 году войско Андрея взяло Киев; это символизировало изменение политического веса русских центров.","Всеволод Большое Гнездо усилил княжескую власть и расширил влияние Владимиро-Суздальской земли.","Князья стремились к единовластию, а бояре защищали свои владения и политическое влияние."],"qa":[["Почему Владимиро-Суздальская земля быстро развивалась?","Здесь были плодородные земли ополья, лесные и речные ресурсы, сравнительно безопасные условия и приток переселенцев из южной Руси."],["Какую роль сыграл Юрий Долгорукий?","Он укреплял Ростово-Суздальскую землю, закладывал и развивал города, расширял политическое влияние. С его именем связано первое летописное упоминание Москвы в 1147 году."],["Почему Андрей Боголюбский сделал Владимир главным центром?","Владимир располагался в центре его владений и позволял создавать собственный политический центр, не зависящий от традиционного Киева. Князь укреплял город и его религиозный престиж."],["Каково значение взятия Киева в 1169 году?","Оно показало, что Киев уже не был единственным главным центром Руси. Северо-Восточная земля могла претендовать на ведущую роль."],["Чем известен Всеволод Большое Гнездо?","Он укрепил княжескую власть, расширил влияние Владимиро-Суздальской земли и оставил большое число сыновей, что отражено в его прозвище."],["Что такое ополье?","Открытые плодородные участки среди лесов, особенно характерные для Ростово-Суздальской земли; они были важны для земледелия и хозяйственного роста."]],"src":"Ю. Лимонов, «Владимиро-Суздальская Русь» о Юрии Долгоруком. Историк характеризует Юрия как энергичного администратора, понимавшего значение городов для освоения и укрепления земли. Основание новых и укрепление старых городов было не только культурной, но и политической мерой: города обеспечивали управление, оборону и хозяйство.","srcq":[["Какие качества Юрия Долгорукого выделяет историк?","Административные способности, умение планировать освоение территории и понимание значения городов."],["Почему основание городов усиливало княжество?","Города были опорными пунктами власти, центрами торговли и ремесла, местами сбора ресурсов и организации обороны."]],"terms":[["Ополье","Плодородные открытые пространства среди лесов; важная сельскохозяйственная зона Северо-Восточной Руси."],["Стольный город","Главный город княжества, в котором находился княжеский престол и управление."],["Боярство","Влиятельная знать и крупные землевладельцы, участвовавшие в управлении."]],"dates":["1125–1157 гг. — княжение Юрия Долгорукого в Ростово-Суздальской земле.","1147 г. — первое летописное упоминание Москвы.","1157–1174 гг. — княжение Андрея Боголюбского.","1169 г. — взятие Киева войсками Андрея Боголюбского.","1176–1212 гг. — княжение Всеволода Большое Гнездо."],"main":"Владимиро-Суздальская земля усилилась благодаря освоению плодородных земель, росту городов и сильной княжеской власти. При Андрее Боголюбском и Всеволоде она стала одним из главных политических центров Руси.","id":"section-10","chapter_name":"Глава II · Русские земли и княжества","search_text":"§ 14–15 владимиро-суздальская земля владимиро-суздальская земля стала одним из сильнейших центров северо-восточной руси. её развитию способствовали плодородные участки ополья, речные пути, приток населения из южных районов и основание новых городов. юрий долгорукий укреплял ростово-суздальскую землю и расширял сеть городов; первое летописное упоминание москвы относится к 1147 году.\n\nандрей боголюбский перенёс политический центр во владимир и стремился усилить собственную власть. в 1169 году его войска взяли киев, но князь не стал постоянно жить в нём. при всеволоде большое гнездо княжество достигло значительного могущества, опираясь на города, боярство и княжеское управление. ополье стольный город боярство "},{"c":2,"n":"§ 16–17","t":"Новгородская земля","pg":"79–88","short":"Новгородская земля отличалась природными условиями и хозяйством: здесь было меньше плодородных пашен, зато развивались торговля, ремёсла, промыслы и использование речных путей. Новгород был крупным торговым центром, связанным с Балтикой, Ганзой и другими русскими землями.\n\nВ 1136 году в Новгороде утвердилась республика. Важные решения принимало вече; князя приглашали для военного руководства, но его власть ограничивали договором. Посадник управлял городскими делами, тысяцкий отвечал за ополчение и часть судебных функций, архиепископ играл большую религиозную и политическую роль. Реальная власть часто находилась у богатых боярских и купеческих групп.","pts":["Новгород находился на торговых путях между Балтикой, Русью и северными территориями.","Природные условия ограничивали земледелие; важную роль играли торговля, ремёсла, охота, рыболовство и сбор пушнины.","В 1136 году князя Всеволода Мстиславича изгнали; вече стало ключевым политическим институтом Новгорода.","Князя приглашали по договору; он не мог единолично менять порядок управления и распоряжаться городом.","Посадник руководил городским управлением, тысяцкий возглавлял ополчение и участвовал в суде, архиепископ представлял церковь.","Новгородская республика не была демократией в современном смысле: влияние часто принадлежало богатым боярским и купеческим семьям."],"qa":[["Как природные условия повлияли на хозяйство Новгородской земли?","Климат и почвы ограничивали земледелие. Поэтому большую роль получили торговля, ремёсла, охота, рыболовство, промыслы и контроль речных путей."],["Почему Новгород стал крупным торговым центром?","Он находился на пересечении водных путей, связывавших Балтийское море, северные районы, другие русские земли и международную торговлю."],["Что произошло в Новгороде в 1136 году?","В Новгороде изгнали князя Всеволода Мстиславича; это событие принято считать началом республиканского устройства с ведущей ролью веча."],["Какие функции выполняли посадник, тысяцкий и архиепископ?","Посадник возглавлял городское управление; тысяцкий руководил ополчением и выполнял судебные функции; архиепископ был главой церкви и влиятельным участником политической жизни."],["Можно ли считать Новгородскую республику современной демократией?","Нет. Вече участвовало в принятии решений, но политическое влияние было неравномерным и часто принадлежало состоятельным боярским и купеческим семьям."],["Как назывались районы Новгорода?","Город делился на стороны и концы. В схеме учебника представлены Софийская и Торговая стороны и городские концы; при ответе следует перечислять именно названия из схемы на страницах этого параграфа."]],"src":"Е. Шмурло, «История России. 862–1917» об ограничениях княжеской власти. В отрывке перечислены ограничения князя: он не мог начинать войну без согласия веча и назначать должностных лиц в пригородах по собственному усмотрению. Источник показывает договорный характер княжеской власти в Новгороде.","srcq":[["Какие ограничения князя перечислены?","Он не мог начинать войну без согласия веча и самостоятельно назначать часть местных правителей."],["Какой вывод следует из источника?","Князь в Новгороде был не полновластным хозяином, а приглашённым правителем, чьи действия ограничивались городскими институтами и договором."]],"terms":[["Вече","Собрание горожан, на котором обсуждались и решались важные вопросы."],["Посадник","Высшее выборное должностное лицо Новгорода, руководившее городским управлением."],["Тысяцкий","Должностное лицо, связанное с ополчением и судом."],["Архиепископ","Глава новгородской церкви, имевший значительное общественное и политическое влияние."]],"dates":["1136 г. — утверждение республиканского устройства в Новгороде.","XII–XV вв. — период существования Новгородской республики."],"main":"Новгородская земля развивалась как торгово-ремесленный регион. Республика с вечем и выборными должностными лицами ограничивала княжескую власть, хотя реальное влияние во многом принадлежало боярской и купеческой верхушке.","id":"section-11","chapter_name":"Глава II · Русские земли и княжества","search_text":"§ 16–17 новгородская земля новгородская земля отличалась природными условиями и хозяйством: здесь было меньше плодородных пашен, зато развивались торговля, ремёсла, промыслы и использование речных путей. новгород был крупным торговым центром, связанным с балтикой, ганзой и другими русскими землями.\n\nв 1136 году в новгороде утвердилась республика. важные решения принимало вече; князя приглашали для военного руководства, но его власть ограничивали договором. посадник управлял городскими делами, тысяцкий отвечал за ополчение и часть судебных функций, архиепископ играл большую религиозную и политическую роль. реальная власть часто находилась у богатых боярских и купеческих групп. вече посадник тысяцкий архиепископ "},{"c":2,"n":"§ 18","t":"Юго-Западная Русь","pg":"89–94","short":"На юго-западе Руси сформировались Галицкая и Волынская земли. Здесь были плодородные почвы, леса, соляные промыслы и выгодные торговые пути к Центральной Европе и Чёрному морю. Галич и Владимир-Волынский стали важными городами.\n\nЯрослав Осмомысл укрепил Галицкую землю и усилил её международное положение. Позднее Роман Мстиславич объединил Галичину и Волынь, создав сильное княжество. Его сын Даниил Романович боролся с боярской оппозицией, Польшей, Венгрией и монголами, поддерживал дипломатические связи с папством и был коронован. После смерти сильных правителей единство юго-западных земель ослабло.","pts":["Галицкая и Волынская земли имели богатые природные ресурсы, плодородные пашни и выгодное положение на торговых путях.","Соль была важным товаром; торговля связывала регион с соседними странами и другими русскими землями.","Ярослав Осмомысл укрепил Галицкое княжество, развивал хозяйство и поддерживал активную внешнюю политику.","Роман Мстиславич объединил Галичину и Волынь в конце XII века.","Даниил Романович укреплял княжескую власть, боролся с боярской оппозицией и противостоял внешнему давлению.","После смерти Даниила и его преемников юго-западные земли постепенно теряли самостоятельность."],"qa":[["Почему экономика Юго-Западной Руси была сильной?","Благодаря плодородным землям, лесным ресурсам, соляным промыслам и расположению на торговых путях между Восточной Европой, Центральной Европой и Чёрным морем."],["Чем известен Ярослав Осмомысл?","Он укрепил Галицкую землю, усилил княжескую власть, развивал хозяйство и поддерживал связи с соседними государствами."],["Как Роман Мстиславич изменил положение юго-западных земель?","Он объединил Галицкую и Волынскую земли, создав крупное и влиятельное княжество."],["Какие задачи решал Даниил Галицкий?","Он стремился подчинить боярскую знать, укрепить города и войско, вести дипломатию с европейскими державами и найти союзников против монгольской угрозы."],["Почему после смерти сильных князей единство ослабло?","Сохранялись интересы влиятельных бояр, династические споры и давление Польши, Венгрии и других соседей; институты единой власти были недостаточно сильны."]],"src":"Д. Володихин, «Рюриковичи» о Данииле Галицком. Автор описывает Даниила как энергичного и смелого правителя, готового рисковать ради власти и расширения владений. Источник помогает увидеть личные качества князя, но для полной характеристики нужно учитывать также оборону, дипломатию, развитие городов и борьбу с боярством.","srcq":[["Какие качества Даниила подчёркивает автор?","Энергию, отвагу, решительность и готовность рисковать ради политических целей."],["Какие исторические факты дополняют эту характеристику?","Борьба Даниила за укрепление княжеской власти, развитие городов, дипломатические контакты и сопротивление внешнему давлению."]],"terms":[["Магнаты","Крупнейшие землевладельцы и политически влиятельные представители знати в странах Центральной и Восточной Европы."],["Боярская оппозиция","Сопротивление части бояр усилению княжеской власти."],["Коронация","Торжественное возведение монарха на престол с вручением короны; в данном контексте — признание Даниила королём."]],"dates":["Вторая половина XII в. — укрепление Галицкой земли при Ярославе Осмомысле.","1199 г. — объединение Галицкой и Волынской земель Романом Мстиславичем.","1205 г. — гибель Романа Мстиславича.","1253 г. — коронация Даниила Романовича."],"main":"Юго-Западная Русь обладала богатыми ресурсами и выгодными торговыми связями. Её сильные князья пытались создать единое государство, но внутренние противоречия и давление соседей затрудняли сохранение независимости.","id":"section-12","chapter_name":"Глава II · Русские земли и княжества","search_text":"§ 18 юго-западная русь на юго-западе руси сформировались галицкая и волынская земли. здесь были плодородные почвы, леса, соляные промыслы и выгодные торговые пути к центральной европе и чёрному морю. галич и владимир-волынский стали важными городами.\n\nярослав осмомысл укрепил галицкую землю и усилил её международное положение. позднее роман мстиславич объединил галичину и волынь, создав сильное княжество. его сын даниил романович боролся с боярской оппозицией, польшей, венгрией и монголами, поддерживал дипломатические связи с папством и был коронован. после смерти сильных правителей единство юго-западных земель ослабло. магнаты боярская оппозиция коронация "},{"c":2,"n":"§ 19–20","t":"Культура и повседневность Руси в IX–XIII вв.","pg":"95–109","short":"После принятия христианства культура Руси развивалась под сильным влиянием Византии, сохраняя собственные особенности. Распространялись книжность и письменность, создавались летописи, переводились церковные тексты. Берестяные грамоты показывают, что письмом пользовались не только духовенство и княжеская знать, но и горожане.\n\nРазвивались архитектура, иконопись, фрески и мозаики. В устной традиции жили былины, сказания и песни; выдающимся памятником литературы стало «Слово о полку Игореве». Культура русских земель имела общие христианские и языковые основы, хотя политическая раздробленность усиливала региональные различия.","pts":["Христианство принесло на Русь новые книжные традиции, церковную письменность и архитектурные образцы.","На Руси развивались переводы и собственное летописание.","Берестяные грамоты — свидетельство повседневной грамотности, деловой переписки и частной жизни горожан.","Былины передавали героические сюжеты в устной форме; летописи фиксировали события по годам.","«Слово о полку Игореве» осмысляло поражение князя Игоря от половцев и призывало князей к единству.","Архитектура и искусство сочетали византийские образцы и местные традиции; применялись мозаики, фрески и иконы."],"qa":[["Какие факты свидетельствуют о распространении грамотности?","Берестяные грамоты, надписи на предметах, книжные мастерские, церковные книги и документы. Особенно важны новгородские грамоты, найденные археологами."],["Чем былины отличаются от летописей?","Былины — устные героические сказания, где исторические события могли преобразовываться фольклорной традицией. Летописи — письменные записи событий, составленные по годам."],["Какова главная идея «Слова о полку Игореве»?","Автор осуждает княжеские раздоры и призывает князей объединиться ради защиты Русской земли от внешних врагов."],["Как византийская культура повлияла на Русь?","Она принесла христианскую книжность, богослужебные традиции, образцы храмовой архитектуры, мозаики, фрески и иконопись. Русские мастера постепенно вырабатывали собственные стили."],["Что общего было в культуре разных русских земель?","Православная вера, церковнославянская письменная традиция, летописание, общие литературные сюжеты и архитектурные принципы."],["Чем отличаются мозаика, фреска и икона?","Мозаика составляется из мелких цветных кусочков камня или стекла; фреска — роспись по сырой штукатурке; икона — священное изображение на отдельной основе."]],"src":"Статья А. Куликовой о Кирике Новгородце и его трактате. Кирик назван учёным, астрономом и математиком, автором «Учения им же ведати человеку числа всех лет», созданного в 1136 году. Это показывает, что в Древней Руси существовали научные интересы и практическое применение математических знаний для календарных и хронологических расчётов.","srcq":[["Чем известен Кирик Новгородец?","Он составил в 1136 году трактат о счёте лет и календарных вычислениях, что свидетельствует о развитии математических и хронологических знаний."],["Почему этот источник важен для истории культуры?","Он показывает, что в древнерусской книжной среде существовали научные интересы и практическое применение математических знаний."]],"terms":[["Летопись","Историческое сочинение, в котором события записывались по годам."],["Берестяная грамота","Письменное сообщение или документ на бересте."],["Былина","Устное народное героическое сказание."],["Фреска","Живопись водяными красками по сырой штукатурке."],["Мозаика","Изображение, составленное из мелких цветных камней или стекла."],["Икона","Священное изображение Христа, Богородицы, святых или библейских событий."]],"dates":["IX–XIII вв. — развитие древнерусской культуры и письменности.","988 г. — крещение Руси, ускорившее развитие христианской книжности и архитектуры.","1136 г. — трактат Кирика Новгородца.","Конец XII в. — создание «Слова о полку Игореве» (традиционная датировка)."],"main":"Культура Руси IX–XIII веков складывалась на основе христианской книжности и местных традиций. Берестяные грамоты, летописи, былины, архитектура и произведения искусства показывают разнообразие духовной и повседневной жизни.","id":"section-13","chapter_name":"Глава II · Русские земли и княжества","search_text":"§ 19–20 культура и повседневность руси в ix–xiii вв. после принятия христианства культура руси развивалась под сильным влиянием византии, сохраняя собственные особенности. распространялись книжность и письменность, создавались летописи, переводились церковные тексты. берестяные грамоты показывают, что письмом пользовались не только духовенство и княжеская знать, но и горожане.\n\nразвивались архитектура, иконопись, фрески и мозаики. в устной традиции жили былины, сказания и песни; выдающимся памятником литературы стало «слово о полку игореве». культура русских земель имела общие христианские и языковые основы, хотя политическая раздробленность усиливала региональные различия. летопись берестяная грамота былина фреска мозаика икона "},{"c":3,"n":"§ 21","t":"Чингисхан и его империя","pg":"112–118","short":"В начале XIII века Темучин объединил монгольские племена и в 1206 году был провозглашён Чингисханом. Он создал сильную военную державу, опиравшуюся на дисциплину, десятичную организацию войска и личную преданность правителю. Монгольская армия отличалась мобильностью, разведкой и строгим подчинением.\n\nВажным сводом правил стала Великая Яса. Завоевания охватили Центральную Азию, Китай и другие регионы. В 1223 году монголы столкнулись с русско-половецкими силами на реке Калке и одержали победу. Это было первое крупное столкновение русских княжеств с монгольским войском и предупреждение о новой угрозе.","pts":["Темучин сумел объединить монгольские племена, используя военную силу, союзы и перераспределение власти.","В 1206 году на курултае Темучина провозгласили Чингисханом; возникла единая Монгольская империя.","Войско было организовано по десятичному принципу: десятки, сотни, тысячи и тумены.","Успехам монголов способствовали конница, мобильность, дисциплина, разведка, координация и осадные технологии.","Великая Яса закрепляла нормы поведения и порядок в государстве и войске.","В 1223 году монголы победили русско-половецкие силы на Калке, но не стали тогда завоёвывать Русь."],"qa":[["Как Чингисхан создал Монгольскую империю?","Он подчинил и объединил монгольские племена, укрепил личную власть, реорганизовал войско и установил общие нормы управления. В 1206 году его провозгласили верховным правителем."],["Почему монгольская армия добивалась успехов?","Благодаря манёвренной коннице, дисциплине, разведке, чёткому командованию, тактическим уловкам и способности быстро концентрировать силы."],["Что такое Великая Яса?","Свод правил и установлений, связанных с управлением Монгольской империей, военной дисциплиной и порядком в обществе."],["Каковы последствия битвы на Калке в 1223 году?","Русско-половецкие войска потерпели поражение; княжества понесли потери и получили предупреждение о военной мощи монголов. Однако поход не привёл к немедленному завоеванию Руси."],["Чем монгольская армия отличалась от феодального войска Западной Европы?","Она была более централизованной и мобильной, имела строгую десятичную организацию и большую долю конницы, что позволяло быстро менять направление удара."]],"src":"Ан-Насави, историк Хорезма, о монгольском нашествии. Автор описывает вторжение монгольских войск как бедствие невиданного масштаба, подчёркивая внезапность и огромную протяжённость похода. Источник передаёт переживание завоёванного региона; эмоциональная окраска объяснима положением автора и опытом завоевания.","srcq":[["Как автор оценивает нашествие?","Как катастрофу огромного масштаба, охватившую множество земель и народов."],["Почему его оценка эмоциональна?","Автор принадлежал к региону, пережившему монгольское завоевание, поэтому описывает события с позиции пострадавшей стороны."]],"terms":[["Курултай","Собрание монгольской знати и военных лидеров для решения важных государственных вопросов."],["Тумен","Военно-административное подразделение, номинально включавшее около десяти тысяч воинов."],["Великая Яса","Свод установлений, поддерживавший порядок в Монгольской империи."]],"dates":["1206 г. — провозглашение Темучина Чингисханом и создание Монгольской империи.","1223 г. — битва на реке Калке."],"main":"Монгольская империя возникла благодаря объединению племён и созданию высокоорганизованной армии. Её экспансия изменила политическую карту Евразии; столкновение на Калке в 1223 году стало первым предупреждением для русских княжеств.","id":"section-14","chapter_name":"Глава III · Натиск с востока и запада","search_text":"§ 21 чингисхан и его империя в начале xiii века темучин объединил монгольские племена и в 1206 году был провозглашён чингисханом. он создал сильную военную державу, опиравшуюся на дисциплину, десятичную организацию войска и личную преданность правителю. монгольская армия отличалась мобильностью, разведкой и строгим подчинением.\n\nважным сводом правил стала великая яса. завоевания охватили центральную азию, китай и другие регионы. в 1223 году монголы столкнулись с русско-половецкими силами на реке калке и одержали победу. это было первое крупное столкновение русских княжеств с монгольским войском и предупреждение о новой угрозе. курултай тумен великая яса "},{"c":3,"n":"§ 22–23","t":"Натиск на русские земли с востока","pg":"119–126","short":"После смерти Чингисхана завоевания продолжили его наследники. В 1235 году на курултае было решено организовать большой западный поход; его возглавил Батый. В 1236 году монголы разгромили Волжскую Булгарию, а в 1237–1240 годах покоряли русские княжества. Города подвергались штурмам и разрушениям, население погибало или попадало в плен.\n\nВ 1237–1238 годах пострадали Рязанская и Северо-Восточная Русь; в 1238 году произошло сражение на реке Сити. В 1240 году пал Киев. Западный поход монголов продолжился в Центральную Европу. Завоевание вызвало демографические потери, разрушение хозяйства и зависимость русских княжеств от Орды.","pts":["В 1235 году приняли решение о западном походе; его главным военным руководителем стал Батый.","В 1236 году монголы покорили Волжскую Булгарию.","В 1237–1238 годах были разорены Рязанская и Северо-Восточная Русь; в 1238 году русские войска потерпели поражение на реке Сити.","В 1239–1240 годах монголы продвинулись на юг; в декабре 1240 года был взят Киев.","Завоевание привело к людским потерям, разрушению городов и ремесла, сокращению хозяйства и установлению зависимости от Орды."],"qa":[["Почему Батый возглавил западный поход монголов?","Он был одним из внуков Чингисхана и получил владения в западной части империи; поход должен был расширить власть монголов в Европе."],["Какие земли пострадали от нашествия?","Волжская Булгария, Рязанское и Владимиро-Суздальское княжества, южные русские земли и Киев; затем монгольское войско вторглось в Центральную Европу."],["Какое значение имела битва на реке Сити?","В марте 1238 года войска великого князя Юрия Всеволодовича потерпели поражение, что ускорило падение сопротивления Северо-Восточной Руси."],["Почему Киев был важной целью похода?","Киев оставался одним из главных исторических, религиозных и культурных центров Руси. Его захват имел военное и символическое значение."],["Каковы главные последствия нашествия?","Разорение городов и сёл, гибель и пленение населения, упадок ремесла и торговли, сокращение ресурсов княжеств и установление зависимости от монгольской державы."]],"src":"Р. Почекаев, «Батый» о решении о западном походе. Историк объясняет, что поход, решение о котором было принято в 1235 году, стал важным этапом истории Монгольской империи и изменил её западные границы. Это была заранее подготовленная крупная военная кампания, а не случайный набег.","srcq":[["Когда было принято решение о походе на Запад?","В 1235 году."],["Почему автор считает поход переломным?","Он определил западные границы Монгольской империи и открыл европейцам масштаб и силу державы, созданной монголами."]],"terms":[["Батый","Внук Чингисхана, руководитель западного похода монголов."],["Завоевание","Подчинение территории военной силой с установлением власти победителя."],["Курултай","Собрание монгольской знати, принимавшее важные решения."]],"dates":["1235 г. — решение о западном походе монголов.","1236 г. — разгром Волжской Булгарии.","1237–1238 гг. — нашествие на Рязанскую и Северо-Восточную Русь.","1238 г. — битва на реке Сити.","1240 г. — взятие Киева.","1241 г. — продолжение западного похода в Центральную Европу."],"main":"Монгольское нашествие 1237–1240 годов нанесло тяжёлый удар по русским княжествам. Разрушение городов, потери населения и хозяйства привели к политической и экономической зависимости от Орды.","id":"section-15","chapter_name":"Глава III · Натиск с востока и запада","search_text":"§ 22–23 натиск на русские земли с востока после смерти чингисхана завоевания продолжили его наследники. в 1235 году на курултае было решено организовать большой западный поход; его возглавил батый. в 1236 году монголы разгромили волжскую булгарию, а в 1237–1240 годах покоряли русские княжества. города подвергались штурмам и разрушениям, население погибало или попадало в плен.\n\nв 1237–1238 годах пострадали рязанская и северо-восточная русь; в 1238 году произошло сражение на реке сити. в 1240 году пал киев. западный поход монголов продолжился в центральную европу. завоевание вызвало демографические потери, разрушение хозяйства и зависимость русских княжеств от орды. батый завоевание курултай "},{"c":3,"n":"§ 24–25","t":"Отражение агрессии с запада","pg":"127–134","short":"Одновременно с монгольской угрозой русские земли сталкивались с давлением с запада. На Балтике и в Прибалтике действовали немецкие и датские феодалы, а также военные монашеские ордены — меченосцы и Тевтонский орден. Они стремились расширить владения и распространить католичество.\n\nНовгород и другие северо-западные земли организовали сопротивление. В 1240 году князь Александр Ярославич разбил шведское войско на Неве и получил прозвище Невский. В 1242 году русские войска победили рыцарей Ливонского ордена на Чудском озере — в Ледовом побоище. Победы остановили продвижение противника вглубь русских земель, хотя не означали полного прекращения соперничества на западных рубежах.","pts":["Западную экспансию в Прибалтике вели шведские, датские и немецкие силы, в том числе военные монашеские ордены.","Шведская угроза была отражена Александром Ярославичем в Невской битве 1240 года.","В 1242 году на Чудском озере произошло Ледовое побоище — победа новгородско-владимирских сил над рыцарями Ливонского ордена.","Победы сорвали планы дальнейшего продвижения противника на северо-западные русские земли.","Александр Невский сочетал военную защиту западных рубежей с осторожной политикой в отношениях с Ордой."],"qa":[["Кто такие крестоносцы и военные монашеские ордены?","Крестоносцы — участники военных походов под религиозными лозунгами. Военные монашеские ордены сочетали монашескую организацию с военной службой; в Прибалтике действовали меченосцы и Тевтонский орден."],["Каковы причины Невской битвы?","Шведское войско стремилось укрепить позиции в устье Невы и получить контроль над важным водным путём и территориями Северо-Запада. Александр Ярославич выступил против вторжения."],["Почему победа на Неве была важна?","Она остановила конкретное шведское наступление и укрепила безопасность новгородских земель и торговых путей."],["В чём значение Ледового побоища?","Победа 1242 года остановила попытки Ливонского ордена продвинуться на русские земли в период, когда Русь уже переживала последствия монгольского нашествия."],["Какие качества Александра Невского проявились в его политике?","Военная решительность на западном направлении, умение быстро организовать войско, дипломатическая осторожность и способность оценивать соотношение сил."]],"src":"В. Кирпичников, статья «Ледовое побоище 1242 г. (новое осмысление)». Историк подчёркивает, что сражение не отличалось огромным числом участников и потерями, однако имело важные последствия: сорвало планы Ливонского ордена по продвижению на Русь. Важно различать реальный масштаб битвы и её стратегическое значение.","srcq":[["Как автор оценивает масштаб битвы?","Он считает, что сражение не было особенно крупным по численности участников и потерям."],["Почему битва всё же названа судьбоносной?","Потому что она остановила захватнические планы Ливонского ордена на русских землях в крайне тяжёлый для Руси период."]],"terms":[["Крестоносцы","Участники военных походов, совершавшихся под религиозными лозунгами и знаком креста."],["Военный монашеский орден","Организация, объединявшая монашеский уклад и военную деятельность."],["Ливонский орден","Католический военный орден, действовавший в Прибалтике."]],"dates":["1240 г. — Невская битва.","5 апреля 1242 г. — Ледовое побоище на Чудском озере."],"main":"Русские земли сумели отразить наступление шведских и немецких рыцарских сил. Победы на Неве и Чудском озере сохранили северо-западные рубежи, хотя борьба за Прибалтику продолжалась.","id":"section-16","chapter_name":"Глава III · Натиск с востока и запада","search_text":"§ 24–25 отражение агрессии с запада одновременно с монгольской угрозой русские земли сталкивались с давлением с запада. на балтике и в прибалтике действовали немецкие и датские феодалы, а также военные монашеские ордены — меченосцы и тевтонский орден. они стремились расширить владения и распространить католичество.\n\nновгород и другие северо-западные земли организовали сопротивление. в 1240 году князь александр ярославич разбил шведское войско на неве и получил прозвище невский. в 1242 году русские войска победили рыцарей ливонского ордена на чудском озере — в ледовом побоище. победы остановили продвижение противника вглубь русск
