их земель, хотя не означали полного прекращения соперничества на западных рубежах. крестоносцы военный монашеский орден ливонский орден "},{"c":3,"n":"§ 26–27","t":"Русские земли и Золотая Орда","pg":"135–143","short":"В 1240-х годах на западных землях Монгольской империи сформировался улус Джучи, позднее известный как Золотая Орда. Русские князья признавали верховную власть ордынского хана, получали ярлыки на княжение и должны были выплачивать дань — «выход». Для контроля и сбора выплат использовались ордынские чиновники, в том числе баскаки.\n\nЗависимость была тяжёлой, но отношения Руси и Орды не сводились только к войне: князья ездили в Орду, вели переговоры, получали поддержку в борьбе с соперниками. При хане Узбеке (1313–1341) Орда укрепилась; ислам стал государственной религией. Переписи населения и сбор дани усилили административный контроль. Русские княжества сохраняли внутреннее управление, но зависели от Орды в вопросах верховной власти и выплат.","pts":["Улус Джучи возник на западной части владений потомков Чингисхана; в русской традиции его называют Золотой Ордой.","Князь получал ярлык — ханскую грамоту, подтверждавшую право на княжение.","Выход — дань, выплачиваемая Орде; сбор сопровождался переписями и деятельностью чиновников.","Баскаки контролировали сбор дани и исполнение ханских распоряжений; позднее большую роль в сборе выплат получали сами князья.","Ордынские ханы использовали соперничество русских князей и могли поддерживать одних против других.","При Узбеке Орда достигла могущества; принятие ислама укрепило её государственную и культурную систему."],"qa":[["Что такое улус Джучи?","Западная часть Монгольской империи, выделенная Джучи и его потомкам. В русской историографии государство известно как Золотая Орда."],["Что означали ярлык, выход и баскак?","Ярлык — ханская грамота на право княжения; выход — дань Орде; баскак — ордынский чиновник, контролировавший сбор дани и исполнение ханских распоряжений."],["Почему ордынские ханы сохраняли русских князей у власти?","Князья могли обеспечивать порядок, собирать дань и управлять населением без прямого ордынского управления каждой землёй. Это было удобнее и дешевле."],["Почему перепись населения вызывала недовольство?","Она помогала точнее определить налоговые обязательства, усиливала контроль и сопровождалась тяжёлым сбором выплат."],["Какие последствия имела зависимость от Орды?","Выплата дани, вмешательство ханов в княжеские споры, необходимость получать ярлыки и ограничение самостоятельной внешней политики. Одновременно княжества сохраняли многие внутренние порядки."],["Что произошло при хане Узбеке?","В 1313–1341 годах Орда укрепилась, ислам стал государственной религией, а власть хана и административная система усилились."]],"src":"Джованни да Плано Карпини, «История монголов». Папский посланник описывает дисциплину монголов, уважение к правителям и особенности общественного поведения. Его взгляд позволяет увидеть устройство Орды глазами иностранца. Путешественник наблюдал общество ограниченное время и мог обобщать особенности отдельных групп.","srcq":[["Какие черты монголов выделяет Карпини?","Повиновение правителям, дисциплину, взаимное уважение и сравнительно строгий общественный порядок."],["Почему к источнику нужно относиться критически?","Автор был иностранным наблюдателем, имел собственные ожидания и мог не знать всех различий между монгольскими группами и слоями общества."]],"terms":[["Улус Джучи","Западная часть Монгольской империи, государство потомков Джучи."],["Ярлык","Ханская грамота, подтверждавшая право князя на управление."],["Выход","Дань, которую русские земли выплачивали Орде."],["Баскак","Ордынский чиновник, следивший за сбором дани и исполнением ханских приказов."],["Ям","Система почтовых станций и дорог для связи и перевозки официальных сообщений."]],"dates":["1242–1243 гг. — оформление государства Батыя на западе Монгольской империи.","1313–1341 гг. — правление хана Узбека."],"main":"Зависимость от Золотой Орды проявлялась в выплате дани и признании ханской власти, но внутреннее управление русских земель сохранялось за князьями. Орда влияла на межкняжескую борьбу и усиливала административный контроль.","id":"section-17","chapter_name":"Глава III · Натиск с востока и запада","search_text":"§ 26–27 русские земли и золотая орда в 1240-х годах на западных землях монгольской империи сформировался улус джучи, позднее известный как золотая орда. русские князья признавали верховную власть ордынского хана, получали ярлыки на княжение и должны были выплачивать дань — «выход». для контроля и сбора выплат использовались ордынские чиновники, в том числе баскаки.\n\nзависимость была тяжёлой, но отношения руси и орды не сводились только к войне: князья ездили в орду, вели переговоры, получали поддержку в борьбе с соперниками. при хане узбеке (1313–1341) орда укрепилась; ислам стал государственной религией. переписи населения и сбор дани усилили административный контроль. русские княжества сохраняли внутреннее управление, но зависели от орды в вопросах верховной власти и выплат. улус джучи ярлык выход баскак ям "},{"c":3,"n":"§ 28–29","t":"Русь и Великое княжество Литовское","pg":"144–151","short":"Великое княжество Литовское усилилось в XIII–XIV веках и расширялось на восток и юг, включая русские земли. Этому способствовали ослабление русских княжеств после монгольского нашествия, военная сила литовских князей и принятие местными элитами нового политического центра. В государстве жили литовцы и многочисленное восточнославянское население.\n\nЛитовские правители использовали русскую письменность и право, а православная культура играла заметную роль. В 1362 году литовско-русские силы победили ордынцев на Синих Водах. Кревская уния 1385 года связала Литву с Польшей. В 1410 году объединённые силы Польши и Литвы разгромили Тевтонский орден под Грюнвальдом.","pts":["Великое княжество Литовское расширялось за счёт русских земель, ослабленных раздробленностью и монгольским нашествием.","Литовские князья использовали местные порядки, русскую письменность и православную традицию; государство было многоэтничным и многоконфессиональным.","В 1362 году войска Ольгерда победили ордынцев в битве на Синих Водах.","В 1385 году Кревская уния связала Литву и Польшу династическим союзом.","В 1410 году в Грюнвальдской битве польско-литовские и союзные силы нанесли поражение Тевтонскому ордену.","В состав княжества входили значительные русские земли, поэтому в источниках правители использовали титулы, связанные с Русью."],"qa":[["Почему Великое княжество Литовское быстро расширялось?","Соседние русские земли были ослаблены раздробленностью и последствиями нашествия; Литва имела сильную княжескую власть и могла включать территории, часто сохраняя местные порядки."],["Как было устроено Великое княжество Литовское?","Это было многоэтничное государство, где литовская правящая династия управляла многочисленными восточнославянскими землями. Использовались русская письменность и правовые нормы, значительную роль играло православие."],["Каково значение битвы на Синих Водах 1362 года?","Победа литовско-русских войск ослабила влияние Орды в части южнорусских земель и способствовала расширению княжества."],["Что означала Кревская уния 1385 года?","Династический союз Литвы и Польши: великий князь Ягайло согласился принять католичество и стать польским королём, что начало сближение государств."],["Почему Грюнвальдская битва 1410 года важна?","Объединённые силы Польши, Литвы и союзников нанесли тяжёлое поражение Тевтонскому ордену, ослабив его и изменив баланс сил в регионе."],["Кто такие магнаты?","Крупнейшие землевладельцы и влиятельные представители знати, сопоставимые по положению с наиболее могущественными боярами."]],"src":"С. Думин, «Другая Русь» о титуле литовских правителей. Историк отмечает, что слово «Русь» присутствовало в титуле правителей государства, созданного литовскими князьями при поддержке восточнославянского боярства. Источник подчёркивает, что Великое княжество Литовское было тесно связано с русскими землями и не являлось исключительно этнически литовским государством.","srcq":[["Что показывает использование слова «Русь» в титуле?","Оно отражает включение русских земель в государство и политическую значимость восточнославянского населения и знати."],["Почему понятие «Литовская Русь» помогает понять историю региона?","Оно подчёркивает смешанный характер государства и переплетение литовской и русской политических и культурных традиций."]],"terms":[["Магнаты","Крупнейшие землевладельцы и политическая верхушка Великого княжества Литовского."],["Уния","Союз государств или династий, оформленный соглашением."],["Кревская уния","Соглашение 1385 года, связавшее Литву с Польшей."]],"dates":["1362 г. — битва на Синих Водах.","1385 г. — Кревская уния.","1410 г. — Грюнвальдская битва."],"main":"Великое княжество Литовское стало крупным центром притяжения русских земель. Его многоэтничный характер, союз с Польшей и победы над орденом определили политическую историю Восточной Европы XIV–XV веков.","id":"section-18","chapter_name":"Глава III · Натиск с востока и запада","search_text":"§ 28–29 русь и великое княжество литовское великое княжество литовское усилилось в xiii–xiv веках и расширялось на восток и юг, включая русские земли. этому способствовали ослабление русских княжеств после монгольского нашествия, военная сила литовских князей и принятие местными элитами нового политического центра. в государстве жили литовцы и многочисленное восточнославянское население.\n\nлитовские правители использовали русскую письменность и право, а православная культура играла заметную роль. в 1362 году литовско-русские силы победили ордынцев на синих водах. кревская уния 1385 года связала литву с польшей. в 1410 году объединённые силы польши и литвы разгромили тевтонский орден под грюнвальдом. магнаты уния кревская уния "},{"c":3,"n":"§ 30","t":"Северо-Восточная Русь в конце XIII — начале XIV в.","pg":"152–158","short":"После нашествия главным политическим вопросом Северо-Восточной Руси стала борьба князей за великое княжение владимирское и право собирать дань для Орды. Соперничали Тверь и Москва, а ханские ярлыки стали важным инструментом политики.\n\nМосковскую династию основал Даниил Александрович, младший сын Александра Невского. Его сыновья Юрий и Иван продолжили борьбу за влияние. Тверской князь Михаил противостоял Москве и Орде; в 1317 году он победил войско Юрия в битве у Бортенева, однако политическое соперничество продолжилось. Для успеха князья использовали браки, договоры, связи с Ордой и поддержку местной знати.","pts":["Главными соперниками были Тверь и Москва; борьба шла за великое княжение владимирское и ханский ярлык.","Даниил Александрович заложил основу московской династии и расширил владения Москвы.","Юрий Данилович активно использовал дипломатические связи и поездки в Орду.","Михаил Тверской обладал сильными позициями и вступал в острое противостояние с Москвой.","В 1317 году у Бортенева войско Михаила Тверского разбило силы Юрия Московского и его союзников.","Соперничество было не только военным: важны были ханская поддержка, церковь, доходы от сбора дани и торговые пути."],"qa":[["Какие центры соперничали в Северо-Восточной Руси?","Прежде всего Москва и Тверь; важную роль также играли Владимир и другие княжеские центры."],["Почему борьба за ярлык была столь важна?","Ярлык давал право на великое княжение владимирское, повышал престиж и позволял влиять на сбор дани с других русских земель."],["Какую роль сыграл Даниил Александрович?","Он укрепил Москву как самостоятельное княжество, расширил её владения и положил начало московской линии князей."],["Чем закончилась битва у Бортенева в 1317 году?","Победой Михаила Тверского над войском Юрия Московского и его союзников. Но это не завершило борьбу за великое княжение."],["Почему Москва постепенно усиливалась?","Благодаря выгодному географическому положению, осторожной политике князей, накоплению земель и ресурсов, поддержке церкви и отношениям с Ордой."]],"src":"В. Ключевский, «Русская история» о географическом положении Москвы. Историк объясняет возвышение Москвы её центральным положением среди наиболее населённых русских земель. Соседние княжества принимали на себя первые удары врагов, а Москва могла использовать относительную защищённость. География была важным, но не единственным фактором.","srcq":[["Какие преимущества Москвы называет историк?","Центральное положение и относительная защищённость от внешних ударов, которые часто принимали на себя соседние княжества."],["Можно ли объяснить возвышение Москвы только географией?","Нет. Важны также политика князей, связи с Ордой, поддержка церкви, расширение владений и хозяйственные ресурсы."]],"terms":[["Великое княжение владимирское","Старший княжеский престол в Северо-Восточной Руси, право на который подтверждал ханский ярлык."],["Ярлык","Ханская грамота, дававшая право на княжение."],["Династия","Род правителей, передающих власть внутри семьи."]],"dates":["1276–1303 гг. — княжение Даниила Александровича в Москве.","1317 г. — битва у Бортенева между войсками Михаила Тверского и Юрия Московского."],"main":"В конце XIII — начале XIV века Северо-Восточная Русь была ареной борьбы Москвы и Твери за великое княжение и ханскую поддержку. География, дипломатия и политика князей стали факторами будущего возвышения Москвы.","id":"section-19","chapter_name":"Глава III · Натиск с востока и запада","search_text":"§ 30 северо-восточная русь в конце xiii — начале xiv в. после нашествия главным политическим вопросом северо-восточной руси стала борьба князей за великое княжение владимирское и право собирать дань для орды. соперничали тверь и москва, а ханские ярлыки стали важным инструментом политики.\n\nмосковскую династию основал даниил александрович, младший сын александра невского. его сыновья юрий и иван продолжили борьбу за влияние. тверской князь михаил противостоял москве и орде; в 1317 году он победил войско юрия в битве у бортенева, однако политическое соперничество продолжилось. для успеха князья использовали браки, договоры, связи с ордой и поддержку местной знати. великое княжение владимирское ярлык династия "},{"c":3,"n":"§ 31","t":"Возвышение Москвы","pg":"159–163","short":"Иван Данилович Калита княжил в Москве в 1325–1340 годах и сумел укрепить положение княжества. После восстания в Твери в 1327 году Орда жестоко подавила выступление; Иван Калита участвовал в карательной экспедиции и получил поддержку хана. В 1328 году он получил ярлык на великое княжение и право собирать ордынскую дань.\n\nМосква стала безопаснее и богаче, а митрополит Пётр перенёс туда свою резиденцию. Это усилило духовный авторитет города. Калита покупал и присоединял земли, поддерживал церковное строительство и накопление средств. Осторожная политика помогла Москве укрепиться среди других княжеств.","pts":["Иван Калита княжил в Москве в 1325–1340 годах и проводил осторожную политику по отношению к Орде.","В 1327 году произошло восстание в Твери против ордынского баскака; оно было подавлено при участии ордынских сил и московского князя.","В 1328 году Иван Калита получил ярлык на великое княжение владимирское и право собирать дань.","Митрополит Пётр перенёс резиденцию в Москву; город стал важным церковным центром.","Князь расширял владения покупками и присоединениями, развивал хозяйство и укреплял казну.","Политика Калиты сочетала лояльность Орде, внутреннее укрепление и постепенное расширение Москвы."],"qa":[["Как восстание в Твери 1327 года повлияло на возвышение Москвы?","После подавления восстания Тверь была ослаблена, а Иван Калита получил ханскую поддержку и возможность усилить свои позиции."],["Почему Орда поддержала Ивана Калиту?","Он демонстрировал лояльность, обеспечивал сбор дани и поддержание порядка. Для хана такой князь был удобным посредником в управлении русскими землями."],["Как перенос митрополичьей резиденции повлиял на Москву?","Он повысил религиозный авторитет и престиж города, привлекал духовенство и укреплял его роль как общерусского центра."],["В чём заключалась политика Калиты?","В осторожном сотрудничестве с Ордой, сборе дани без крупных выступлений, накоплении средств, расширении владений и поддержке церкви."],["Почему прозвище «Калита» связано с богатством?","«Калита» — кошель для денег. Прозвище связывают с бережливостью и накоплением средств."]],"src":"А. Муравьёв и А. Сахаров, «Очерки истории русской культуры IX–XVII вв.». Авторы отмечают, что к XIV–XV векам сохранилось сравнительно немного материальных памятников, но они позволяют увидеть постепенное преодоление последствий нашествия и возобновление культурного развития.","srcq":[["Что авторы считают важным изменением с середины XIV века?","Начало нового подъёма материальной культуры после тяжёлых последствий иноземного нашествия."],["Какие свидетельства могут подтверждать культурный подъём?","Археологические находки, ремесленные изделия, каменное строительство, предметы быта и произведения искусства."]],"terms":[["Митрополия","Церковная область, возглавляемая митрополитом; перенос её центра повышал духовное значение города."],["Баскак","Ордынский чиновник, следивший за сбором дани и порядком."],["Карательная экспедиция","Военный поход, направленный на подавление восстания и наказание участников."]],"dates":["1325–1340 гг. — княжение Ивана Калиты в Москве.","1327 г. — восстание в Твери.","1328 г. — получение Иваном Калитой ярлыка на великое княжение."],"main":"Иван Калита укрепил Москву благодаря осторожной политике, ханской поддержке, накоплению ресурсов и усилению церковного авторитета. Москва постепенно превратилась в один из главных центров Северо-Восточной Руси.","id":"section-20","chapter_name":"Глава III · Натиск с востока и запада","search_text":"§ 31 возвышение москвы иван данилович калита княжил в москве в 1325–1340 годах и сумел укрепить положение княжества. после восстания в твери в 1327 году орда жестоко подавила выступление; иван калита участвовал в карательной экспедиции и получил поддержку хана. в 1328 году он получил ярлык на великое княжение и право собирать ордынскую дань.\n\nмосква стала безопаснее и богаче, а митрополит пётр перенёс туда свою резиденцию. это усилило духовный авторитет города. калита покупал и присоединял земли, поддерживал церковное строительство и накопление средств. осторожная политика помогла москве укрепиться среди других княжеств. митрополия баскак карательная экспедиция "},{"c":3,"n":"§ 32–33","t":"Победа на Куликовом поле","pg":"164–172","short":"Во второй половине XIV века Золотая Орда переживала внутреннюю борьбу и частую смену правителей. Московский князь Дмитрий Иванович укреплял княжество и объединял силы русских земель. В 1378 году русское войско победило ордынцев на реке Воже.\n\n8 сентября 1380 года на Куликовом поле войско Дмитрия столкнулось с армией Мамая. Победа русских войск стала символом сопротивления ордынской зависимости и укрепила авторитет Москвы. Однако зависимость не прекратилась: в 1382 году хан Тохтамыш сжёг Москву и восстановил выплату дани. Куликовская победа стала важным шагом, но не окончательным освобождением от Орды.","pts":["В Орде в 1359–1380 годах продолжалась политическая нестабильность, которой русские князья пытались воспользоваться.","Дмитрий Иванович укреплял Москву, строил белокаменный Кремль и собирал союзников.","В 1378 году на реке Воже русское войско одержало победу над ордынским войском.","8 сентября 1380 года русские полки победили армию Мамая на Куликовом поле.","Победа имела огромное моральное и политическое значение, усилила авторитет Москвы и идею объединения русских земель.","В 1382 году Тохтамыш разорил Москву; данническая зависимость от Орды сохранялась ещё почти столетие."],"qa":[["Почему Дмитрий Иванович смог выступить против Мамая?","Орда была ослаблена внутренними усобицами, а Москва укрепилась и смогла объединить значительные силы русских княжеств."],["Какое значение имела победа на реке Воже в 1378 году?","Она стала первой крупной победой русских войск над ордынцами в открытом сражении и укрепила уверенность в возможности сопротивления."],["Почему Куликовская битва стала важным событием?","Она продемонстрировала возможность объединённых действий русских княжеств, ослабила военный престиж Мамая и усилила роль Москвы."],["Кто командовал русским войском и кто возглавил противника?","Русское войско возглавлял великий князь Дмитрий Иванович; армией противника руководил темник Мамай."],["Почему Куликовская победа не означала окончательного освобождения от Орды?","В 1382 году хан Тохтамыш разорил Москву и восстановил выплату дани. Ордынская власть сохраняла значительные ресурсы и влияние."],["Какую роль сыграл Сергий Радонежский?","Он поддерживал идею единства русских князей и духовно укреплял сопротивление; его авторитет способствовал объединению вокруг Москвы."]],"src":"С. Соловьёв, «История России с древнейших времён» о завещании Дмитрия Донского. Историк отмечает, что великое княжение Владимирское передавалось сыну как наследственное владение. Это свидетельствует об укреплении московской династии и стремлении сделать передачу власти внутри семьи более устойчивой.","srcq":[["Какое новшество Соловьёв видит в завещании Дмитрия?","Дмитрий передавал старшему сыну великое княжение Владимирское как отчину, то есть наследственное владение."],["Почему это было важно для Москвы?","Так укреплялись наследственные права московской династии и ослаблялась зависимость великого княжения от ханского решения и соперников."]],"terms":[["Темник","Военачальник, командовавший туменом в монгольской армии."],["Куликовская битва","Сражение 8 сентября 1380 года между русским войском Дмитрия Ивановича и войском Мамая."],["Отчина","Наследственное владение, передаваемое потомкам."]],"dates":["1359–1380 гг. — период внутренней борьбы в Золотой Орде.","1378 г. — победа русских войск на реке Воже.","8 сентября 1380 г. — Куликовская битва.","1382 г. — поход Тохтамыша на Москву.","1359–1389 гг. — княжение Дмитрия Ивановича в Москве."],"main":"Куликовская победа 1380 года укрепила авторитет Москвы и показала возможность объединения русских земель против Орды. Но поход Тохтамыша в 1382 году напомнил, что освобождение от зависимости ещё не завершено.","id":"section-21","chapter_name":"Глава III · Натиск с востока и запада","search_text":"§ 32–33 победа на куликовом поле во второй половине xiv века золотая орда переживала внутреннюю борьбу и частую смену правителей. московский князь дмитрий иванович укреплял княжество и объединял силы русских земель. в 1378 году русское войско победило ордынцев на реке воже.\n\n8 сентября 1380 года на куликовом поле войско дмитрия столкнулось с армией мамая. победа русских войск стала символом сопротивления ордынской зависимости и укрепила авторитет москвы. однако зависимость не прекратилась: в 1382 году хан тохтамыш сжёг москву и восстановил выплату дани. куликовская победа стала важным шагом, но не окончательным освобождением от орды. темник куликовская битва отчина "},{"c":4,"n":"§ 34–35","t":"Московское княжество в конце XIV — первой половине XV в.","pg":"176–183","short":"После Дмитрия Донского московский престол занял Василий I (1389–1425). Он продолжал укреплять княжество и расширял влияние Москвы. После его смерти началась длительная борьба за престол между Василием II и родственниками — феодальная война второй четверти XV века.\n\nВойна сопровождалась ослеплением Василия II, пленениями и сменой власти, но в итоге победил Василий II. Его успех укрепил принцип передачи власти по прямой линии от отца к сыну. Важным религиозным событием стало провозглашение автокефалии Русской церкви в 1448 году, когда митрополита избрали без согласования с Константинополем.","pts":["Василий I княжил в 1389–1425 годах и продолжал политику Дмитрия Донского.","После 1425 года разгорелась борьба Василия II с дядей Юрием Дмитриевичем и его сыновьями.","Феодальная война длилась с перерывами в 1425–1453 годах и сопровождалась пленениями и ослеплением Василия II.","Победа Василия II укрепила наследование великого княжения по прямой линии от отца к сыну.","В 1448 году русские епископы самостоятельно избрали митрополита Иону — это стало началом фактической автокефалии Русской церкви.","Политическое и церковное укрепление Москвы шло параллельно с ослаблением прежней зависимости от внешних центров."],"qa":[["Как Василий I продолжил политику Дмитрия Донского?","Он укреплял московские владения, расширял влияние и стремился сохранять стабильность, используя дипломатические связи и военную силу."],["Почему началась феодальная война второй четверти XV века?","Из-за спора о порядке наследования престола между Василием II и ветвями княжеской семьи, претендовавшими на великое княжение."],["Чем закончилась борьба Василия II?","Победой Василия II и укреплением принципа наследования престола по прямой линии от отца к сыну."],["Что означает автокефалия?","Самостоятельность поместной православной церкви, которая сама избирает своего главу и не подчиняется другой церковной власти."],["Почему событие 1448 года важно?","Русские епископы избрали митрополита Иону без утверждения Константинополя. Это укрепило самостоятельность Русской церкви."]],"src":"В. Ключевский о Василии II. Историк подчёркивает, что Василий II, начав княжение ребёнком и пережив поражения, пленение и ослепление, в итоге вышел из длительной борьбы победителем и усилил положение московской династии. Это оценка историка, помогающая увидеть политический результат феодальной войны.","srcq":[["Какие испытания прошёл Василий II?","Он пережил пленение, поражения и ослепление, а также многолетнюю борьбу с родственниками."],["Каков главный итог его правления?","Победа в династической борьбе и укрепление прямого наследования московского престола."]],"terms":[["Феодальная война","Вооружённая борьба между представителями княжеской династии за власть и владения."],["Автокефалия","Самостоятельность православной церкви в управлении и избрании главы."],["Династический кризис","Конфликт внутри правящего рода из-за порядка наследования власти."]],"dates":["1389–1425 гг. — княжение Василия I.","1425–1453 гг. — феодальная война в Московском княжестве.","1448 г. — самостоятельное избрание митрополита Ионы.","1425–1462 гг. — княжение Василия II."],"main":"Несмотря на феодальную войну, Москва укрепила наследственный принцип передачи власти. Провозглашение автокефалии в 1448 году стало важным шагом к церковной самостоятельности.","id":"section-22","chapter_name":"Глава IV · Объединение Руси","search_text":"§ 34–35 московское княжество в конце xiv — первой половине xv в. после дмитрия донского московский престол занял василий i (1389–1425). он продолжал укреплять княжество и расширял влияние москвы. после его смерти началась длительная борьба за престол между василием ii и родственниками — феодальная война второй четверти xv века.\n\nвойна сопровождалась ослеплением василия ii, пленениями и сменой власти, но в итоге победил василий ii. его успех укрепил принцип передачи власти по прямой линии от отца к сыну. важным религиозным событием стало провозглашение автокефалии русской церкви в 1448 году, когда митрополита избрали без согласования с константинополем. феодальная война автокефалия династический кризис "},{"c":4,"n":"§ 36–37","t":"Иван III — государь всея Руси","pg":"184–193","short":"Иван III правил в 1462–1505 годах и завершил важнейший этап объединения русских земель вокруг Москвы. В 1478 году к Москве присоединили Новгород, в 1485 году — Тверь. В 1480 году произошло стояние на реке Угре: войска Ивана III и хана Ахмата не решились на решающее сражение, и Орда отступила. Это событие принято считать концом ордынской зависимости.\n\nИван III усилил центральную власть, использовал титул «государь всея Руси» и символы суверенитета, включая двуглавого орла. Брак с Софьей Палеолог подчёркивал престиж московского двора и связи с византийской традицией. Москва становилась центром единого государства, хотя объединение земель продолжалось и после Ивана III.","pts":["Иван III правил в 1462–1505 годах и последовательно присоединял русские земли к Москве.","В 1478 году была ликвидирована независимость Новгородской республики; в 1485 году присоединена Тверь.","В 1480 году стояние на Угре завершилось отходом войск Орды и прекращением зависимости.","Иван III укрепил центральную власть и использовал титул «государь всея Руси».","При нём утвердились новые государственные символы, включая двуглавого орла; усилился придворный церемониал.","Брак с Софьей Палеолог повысил международный престиж московского двора и усилил связь с византийским наследием."],"qa":[["Какие задачи решал Иван III во внешней и внутренней политике?","Он объединял русские земли, ограничивал самостоятельность удельных князей, укреплял центральную власть и добивался прекращения зависимости от Орды."],["Почему присоединение Новгорода в 1478 году было особенно важно?","Новгород был крупным торговым центром с богатой территорией и самостоятельной политической традицией. Его присоединение значительно усилило ресурсы Москвы и завершило существование республики."],["Каково значение стояния на Угре 1480 года?","Ордынский хан Ахмат не смог добиться подчинения Ивана III и отступил. Это событие считают завершением ордынской зависимости Руси."],["Почему Иван III использовал титул «государь всея Руси»?","Титул подчёркивал притязание московского князя на власть над русскими землями и суверенный статус объединяющегося государства."],["Какую роль сыграла Софья Палеолог?","Её брак с Иваном III укрепил международный престиж московского двора и подчеркнул связи с византийской императорской традицией."],["Что символизировал двуглавый орёл?","Он стал знаком верховной государственной власти и суверенитета; его использование связывало московскую монархию с византийской символической традицией."]],"src":"Н. Карамзин о внешнем положении России при Иване III. Карамзин пишет, что после длительной изоляции от европейской политической жизни Россия при Иване III как бы вышла из тени. Это обобщающая оценка историка, а не утверждение о полном отсутствии контактов ранее.","srcq":[["С чем была связана изоляция Руси от Европы?","С последствиями монгольского нашествия, ордынской зависимостью, внутренней раздробленностью и сложной международной обстановкой. Контакты с Европой полностью не прекращались."],["Почему при Иване III расширились международные связи?","Объединённое и более сильное государство стало самостоятельнее во внешней политике, укрепило дипломатические контакты и приобрело больший политический вес."]],"terms":[["Государь всея Руси","Титул московского правителя, подчёркивавший притязания на верховную власть над русскими землями."],["Самодержец","Правитель, обладающий верховной, независимой государственной властью."],["Стояние на Угре","Противостояние московских и ордынских войск в 1480 году, завершившееся отходом Орды."]],"dates":["1462–1505 гг. — правление Ивана III.","1478 г. — присоединение Новгорода.","1480 г. — стояние на реке Угре.","1485 г. — присоединение Твери."],"main":"При Иване III вокруг Москвы сложилось единое Российское государство. Присоединение крупных земель, прекращение ордынской зависимости и укрепление государевых символов повысили международный статус страны.","id":"section-23","chapter_name":"Глава IV · Объединение Руси","search_text":"§ 36–37 иван iii — государь всея руси иван iii правил в 1462–1505 годах и завершил важнейший этап объединения русских земель вокруг москвы. в 1478 году к москве присоединили новгород, в 1485 году — тверь. в 1480 году произошло стояние на реке угре: войска ивана iii и хана ахмата не решились на решающее сражение, и орда отступила. это событие принято считать концом ордынской зависимости.\n\nиван iii усилил центральную власть, использовал титул «государь всея руси» и символы суверенитета, включая двуглавого орла. брак с софьей палеолог подчёркивал престиж московского двора и связи с византийской традицией. москва становилась центром единого государства, хотя объединение земель продолжалось и после ивана iii. государь всея руси самодержец стояние на угре "},{"c":4,"n":"§ 38–39","t":"Российское государство и общество во второй половине XV в.","pg":"194–202","short":"Во второй половине XV века складывались органы управления единого Российского государства. При государе действовала Боярская дума, а на местах сохранялись наместники и волостели. Они получали доходы за счёт кормления, что часто вызывало злоупотребления. Важным шагом к централизации стал Судебник 1497 года — единый свод законов для государства.\n\nСудебник упорядочил суд и наказания, ограничил переход крестьян определённым сроком вокруг осеннего Юрьева дня и установил плату за уход — пожилое. Развивалась поместная система: служилые люди получали землю за службу. Общество включало бояр, служилых землевладельцев, крестьян, посадских людей и казаков. В церковной жизни шли споры нестяжателей и иосифлян о богатстве монастырей и роли собственности.","pts":["Боярская дума была советом при государе, участвовала в обсуждении важнейших государственных дел.","На местах управляли наместники и волостели; система кормлений давала им содержание за счёт местных жителей.","Судебник 1497 года стал общим законодательным сводом и укрепил единообразие суда.","Статья 57 Судебника ограничивала переход крестьян сроком вокруг осеннего Юрьева дня и предусматривала уплату пожилого.","Поместье — земельное владение, предоставлявшееся за службу; оно укрепляло связь землевладения с военной обязанностью.","Нестяжатели призывали к отказу от монастырского землевладения, иосифляне защищали право монастырей владеть землёй и имуществом."],"qa":[["Какую роль играла Боярская дума?","Она была совещательным органом при государе, в который входили представители высшей знати; участвовала в обсуждении управления, внешней политики и важных решений."],["Что такое кормление и почему оно вызывало недовольство?","Кормление — способ содержания наместников и волостелей за счёт местного населения. Оно могло порождать вымогательство и произвол, поскольку чиновник был заинтересован извлекать доходы из должности."],["Какие изменения внёс Судебник 1497 года?","Он установил единые нормы суда и наказаний, укрепил центральную власть и ограничил крестьянский переход определённым временем года с выплатой пожилого."],["Что такое поместье?","Земельное владение, предоставлявшееся служилому человеку за государеву службу; право на землю было связано с исполнением службы."],["В чём спорили нестяжатели и иосифляне?","Нестяжатели выступали против крупного монастырского землевладения и за личную скромность монастырей. Иосифляне считали монастырскую собственность необходимой для церковной и общественной деятельности."],["Что такое Юрьев день и пожилое?","Осенний Юрьев день — 26 ноября по старому стилю; вокруг этой даты крестьяне могли перейти от одного владельца к другому. Пожилое — плата за уход и пользование двором."]],"src":"Судебник 1497 года, статья 57 о переходе крестьян. Статья разрешала крестьянам переходить от одного владельца к другому только в установленный срок вокруг осеннего Юрьева дня и требовала уплаты пожилого. Это начало законодательного ограничения крестьянской мобильности; статья ещё не устанавливала полного крепостного права.","srcq":[["Когда крестьянин мог перейти к другому владельцу?","В установленный срок: за неделю до осеннего Юрьева дня и в течение недели после него."],["Какой платёж требовалось внести при уходе?","Пожилое — плату за пользование двором и проживание у владельца."],["Почему статья важна для истории крестьянства?","Она ограничила свободу перехода крестьян и стала одним из этапов постепенного закрепощения."]],"terms":[["Кормление","Способ содержания наместников и волостелей за счёт сборов с местного населения."],["Поместье","Земельное владение, предоставлявшееся за государеву службу."],["Пожилое","Плата, которую крестьянин вносил при переходе к другому владельцу."],["Челобитная","Письменная просьба или жалоба, подававшаяся государю или властям."],["Слобода","Поселение или район, жители которого первоначально имели особые хозяйственные или налоговые льготы."]],"dates":["1497 г. — принятие Судебника Ивана III.","Осенний Юрьев день — 26 ноября по старому стилю; срок крестьянского перехода был привязан к этой дате."],"main":"Во второй половине XV века управление России становилось более централизованным. Судебник 1497 года унифицировал суд и ограничил крестьянский переход, а поместная система связала земельное владение с государственной службой.","id":"section-24","chapter_name":"Глава IV · Объединение Руси","search_text":"§ 38–39 российское государство и общество во второй половине xv в. во второй половине xv века складывались органы управления единого российского государства. при государе действовала боярская дума, а на местах сохранялись наместники и волостели. они получали доходы за счёт кормления, что часто вызывало злоупотребления. важным шагом к централизации стал судебник 1497 года — единый свод законов для государства.\n\nсудебник упорядочил суд и наказания, ограничил переход крестьян определённым сроком вокруг осеннего юрьева дня и установил плату за уход — пожилое. развивалась поместная система: служилые люди получали землю за службу. общество включало бояр, служилых землевладельцев, крестьян, посадских людей и казаков. в церковной жизни шли споры нестяжателей и иосифлян о богатстве монастырей и роли собственности. кормление поместье пожилое челобитная слобода "},{"c":4,"n":"§ 40–41","t":"Правление Василия III","pg":"203–211","short":"Василий III правил в 1505–1533 годах и продолжил политику объединения русских земель. В 1510 году к Москве присоединили Псков, в 1514 году после войны с Литвой был возвращён Смоленск, в 1521 году — Рязань. Усиление центральной власти сопровождалось ликвидацией последних самостоятельных княжеских центров.\n\nВ международной политике сохранялись противостояние с Литвой и угрозы со стороны Крымского ханства. В духовной и политической мысли получила известность идея монаха Филофея о Москве как «Третьем Риме»: после падения Константинополя Москва представлялась хранительницей православной веры. Эта идея подчёркивала особую миссию государства, но не была официальной конституционной доктриной.","pts":["Василий III продолжил централизацию государства и присоединение самостоятельных земель.","В 1510 году был присоединён Псков, в 1514 году — Смоленск, в 1521 году — Рязань.","Возвращение Смоленска укрепило западную границу и имело большое стратегическое значение.","Крымское ханство оставалось опасным противником; южные рубежи нуждались в обороне.","Филофей сформулировал идею Москвы как «Третьего Рима» — центра сохранения православия после падения Рима и Константинополя.","Централизация усиливала государство, но сокращала самостоятельность местных политических элит."],"qa":[["Что такое теория «Москва — Третий Рим»?","Идея, выраженная монахом Филофеем: после падения Рима и Константинополя Москва стала главным центром православного христианства и должна хранить истинную веру."],["Почему присоединение Пскова в 1510 году было важно?","Псков был самостоятельным политическим центром и важным западным рубежом. Его присоединение завершало ещё один этап объединения русских земель."],["Почему Смоленск имел стратегическое значение?","Он находился на важном западном направлении, контролировал пути между Русским государством и Литвой и защищал западные рубежи."],["Каковы итоги внешней политики Василия III?","Расширение территории и присоединение важных городов, но также продолжение конфликтов с Литвой и необходимость противостоять крымским набегам."],["Что такое челобитная и слобода?","Челобитная — письменная просьба или жалоба властям. Слобода — поселение или район с особыми хозяйственными и налоговыми условиями."]],"src":"«Лицевой летописный свод» XVI века об осаде Смоленска. Летописное описание рассказывает о походе Василия III, окружении города и применении большого пушечного и пищального вооружения. Источник показывает, что артиллерия стала важной частью осадной войны, а государь лично участвовал в крупной кампании.","srcq":[["Какие средства применялись при осаде?","В тексте упоминаются крупные пушки и пищальное вооружение, а также окружение города войсками."],["Что источник говорит о характере войны начала XVI века?","Осадная война становилась технически сложнее; артиллерия играла всё большую роль при взятии укреплённых городов."]],"terms":[["Третий Рим","Религиозно-политическая идея о Москве как наследнице православной традиции Рима и Константинополя."],["Челобитная","Письменная просьба или жалоба, обращённая к государю или властям."],["Слобода","Поселение или район с особыми хозяйственными и налоговыми условиями."]],"dates":["1505–1533 гг. — правление Василия III.","1510 г. — присоединение Пскова.","1514 г. — возвращение Смоленска.","1521 г. — присоединение Рязани."],"main":"Василий III завершил ряд крупных этапов объединения русских земель, подчинив Псков, вернув Смоленск и присоединив Рязань. Его правление укрепило централизованное государство и усилило представление о Москве как центре православного мира.","id":"section-25","chapter_name":"Глава IV · Объединение Руси","search_text":"§ 40–41 правление василия iii василий iii правил в 1505–1533 годах и продолжил политику объединения русских земель. в 1510 году к москве присоединили псков, в 1514 году после войны с литвой был возвращён смоленск, в 1521 году — рязань. усиление центральной власти сопровождалось ликвидацией последних самостоятельных княжеских центров.\n\nв международной политике сохранялись противостояние с литвой и угрозы со стороны крымского ханства. в духовной и политической мысли получила известность идея монаха филофея о москве как «третьем риме»: после падения константинополя москва представлялась хранительницей православной веры. эта идея подчёркивала особую миссию государства, но не была официальной конституционной доктриной. третий рим челобитная слобода "},{"c":4,"n":"§ 42–43","t":"Культура Руси в XIII — первой трети XVI в.","pg":"212–223","short":"После монгольского нашествия культурная жизнь русских земель пережила тяжёлый период, но постепенно восстановилась. В XIV–XVI веках развивались каменное зодчество, иконопись, летописание и книжность. Москва становилась крупным художественным центром, привлекавшим мастеров из других земель и из Византии.\n\nСреди выдающихся художников были Феофан Грек, Андрей Рублёв и Дионисий. В архитектуре использовались новые решения, в том числе шатровый стиль. В Москве работали итальянские мастера, в том числе Аристотель Фиораванти, построивший Успенский собор Кремля. Культура выражала укрепление единого государства и общерусского самосознания.","pts":["После нашествия многие центры культуры были разорены, но с середины XIV века началось восстановление ремесла, архитектуры и искусства.","Феофан Грек оказал большое влияние на русскую монументальную живопись и иконопись.","Андрей Рублёв прославился духовной глубиной, гармонией и человечностью образов; его наиболее известное произведение — «Троица». ","Дионисий стал одним из ведущих мастеров конца XV — начала XVI века.","Аристотель Фиораванти построил Успенский собор Московского Кремля, соединив русские традиции и европейский инженерный опыт.","Шатровый стиль характеризуется высоким многогранным шатром над основным объёмом здания; он стал важным явлением русской архитектуры XVI века."],"qa":[["Почему культура русских земель восстановилась после нашествия?","Постепенно возрождались города, торговля и ремёсла; укреплялись княжества, росли ресурсы для строительства храмов и монастырей, привлекались мастера и развивались местные художественные школы."],["Какие мастера прославили русскую живопись?","Феофан Грек, Андрей Рублёв и Дионисий. Их творчество отражало византийские традиции и развитие собственных русских художественных особенностей."],["Чем известен Андрей Рублёв?","Он создал выдающиеся иконы, среди которых наиболее знаменита «Троица». Его произведения отличают гармония, духовная глубина и мягкость образов."],["Какую роль сыграл Аристотель Фиораванти?","Итальянский архитектор и инженер руководил строительством Успенского собора Московского Кремля, привнеся новые технические решения при сохранении русской церковной традиции."],["Что такое шатровый стиль?","Архитектурный приём, при котором здание завершается высоким шатром — многогранной пирамидальной крышей. Один из известных примеров — церковь Вознесения в Коломенском."],["Как культура отражала объединение государства?","Строительство памятников в Москве, развитие единой летописной и церковной традиции и работа мастеров из разных земель подчёркивали общность русской культуры и силу нового центра."]],"src":"И. Заволоко, статья об Андрее Рублёве. Исследователь отмечает, что творчество Рублёва отличалось возвышенным духовным настроем и любовью к человеку. Источник помогает объяснить художественную особенность его икон: они создают впечатление внутреннего мира, согласия и милосердия.","srcq":[["В чём особенность творчества Андрея Рублёва по источнику?","В духовной возвышенности, гармонии и особой человечности образов."],["Как это проявляется в «Троице»?","В спокойной композиции, согласованности фигур и выражении идеала любви, согласия и духовного единства."]],"terms":[["Шатровый стиль","Архитектурный стиль, в котором здание завершается высоким шатром."],["Фреска","Роспись по сырой штукатурке."],["Мозаика","Изображение из мелких цветных кусочков стекла или камня."],["Иконопись","Создание икон — священных изображений в христианской традиции."]],"dates":["Середина XIV в. — начало нового подъёма материальной культуры.","1408 г. — росписи Успенского собора во Владимире, связанные с Андреем Рублёвым и Даниилом Чёрным.","1475–1479 гг. — строительство Успенского собора Московского Кремля Аристотелем Фиораванти.","Конец XV — начало XVI в. — расцвет творчества Дионисия."],"main":"Культура XIII — первой трети XVI века прошла путь от восстановления после нашествия к новому подъёму. Иконопись Рублёва и Дионисия, московская архитектура и работа иностранных мастеров стали выражением укрепления единого Российского государства.","id":"section-26","chapter_name":"Глава IV · Объединение Руси","search_text":"§ 42–43 культура руси в xiii — первой трети xvi в. после монгольского нашествия культурная жизнь русских земель пережила тяжёлый период, но постепенно восстановилась. в xiv–xvi веках развивались каменное зодчество, иконопись, летописание и книжность. москва становилась крупным художественным центром, привлекавшим мастеров из других земель и из византии.\n\nсреди выдающихся художников были феофан грек, андрей рублёв и дионисий. в архитектуре использовались новые решения, в том числе шатровый стиль. в москве работали итальянские мастера, в том числе аристотель фиораванти, построивший успенский собор кремля. культура выражала укрепление единого государства и общерусского самосознания. шатровый стиль фреска мозаика иконопись "}];
const chapters={1:'ГЛАВА I · ВЕЛИКОЕ ПЕРЕСЕЛЕНИЕ И ДРЕВНЯЯ РУСЬ',2:'ГЛАВА II · РУССКИЕ ЗЕМЛИ И КНЯЖЕСТВА',3:'ГЛАВА III · БОРЬБА С ВНЕШНИМИ УГРОЗАМИ И ВОЗВЫШЕНИЕ МОСКВЫ',4:'ГЛАВА IV · ОБЪЕДИНЕНИЕ РУСИ И СОЗДАНИЕ ГОСУДАРСТВА'};
const TABS=[['short','Краткий пересказ'],['points','Пересказ по пунктам'],['qa','Ответы на вопросы'],['source','Работа с источником'],['terms','Работа с понятиями'],['dates','Хронология и даты']];
let current=null, tab='short', favorites=new Set(JSON.parse(localStorage.getItem('gdz-favs')||'[]')), studied=new Set(JSON.parse(localStorage.getItem('gdz-studied')||'[]')), onlyFav=false;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
function save(){localStorage.setItem('gdz-favs',JSON.stringify([...favorites]));localStorage.setItem('gdz-studied',JSON.stringify([...studied]));}
function visibleData(){let q=$('search').value.trim().toLowerCase();return DATA.filter(x=>(!onlyFav||favorites.has(x.id))&&(!q||x.search_text.includes(q)||x.n.toLowerCase().includes(q)||x.t.toLowerCase().includes(q)));}
function visibleData(){let q=$('search').value.trim().toLowerCase();return DATA.filter(x=>(!onlyFav||favorites.has(x.id))&&(!activeChapter||x.c===activeChapter)&&(!q||x.search_text.includes(q)||x.n.toLowerCase().includes(q)||x.t.toLowerCase().includes(q)));}
let activeChapter=0;
function card(x){return `<button class="section-card" data-id="${x.id}"><div class="meta"><span class="pill">${esc(x.n)}</span><span class="pages">стр. ${esc(x.pg)}</span></div><strong>${esc(x.t)}</strong><small>${studied.has(x.id)?'✓ Изучено':'Открыть конспект'} · ${x.qa.length} ответов</small></button>`;}
function renderHome(){current=null;tab='short';$('favBtn').textContent=onlyFav?'★ Избранное включено':'☆ Избранное';const items=visibleData();const totalQA=DATA.reduce((a,x)=>a+x.qa.length,0);const done=studied.size;let html=`<section class="hero"><div class="eyebrow">ЭЛЕКТРОННЫЙ ПОМОЩНИК ПО ИСТОРИИ</div><h1>ГДЗ по истории<br><span class="spark">России</span></h1><p>6 класс · Учебник Мединского и Торкунова. Выбирай главу и параграф, повторяй материал по пунктам учебника, изучай понятия и проверяй ответы. Все страницы открываются в этом окне.</p></section><div class="stats"><div class="stat"><strong>26</strong><span>тематических блоков</span></div><div class="stat"><strong>§ 1–43</strong><span>охват учебника</span></div><div class="stat"><strong>${totalQA}</strong><span>вопросов с ответами</span></div><div class="stat"><strong>${done}/26</strong><span>тем изучено</span><div class="progress-track"><div class="progress-fill" style="width:${done/26*100}%"></div></div></div></div><div class="section-title"><h2>Выбери главу</h2><small>Нажми на главу, чтобы отфильтровать темы</small></div><div class="chapter-strip">${[0,1,2,3,4].map(c=>`<button class="chapter-chip ${activeChapter===c?'active':''}" data-chapter="${c}"><b>${c===0?'Все главы':'Глава '+['','I','II','III','IV'][c]}</b>${c===0?'Все 26 тем':DATA.filter(x=>x.c===c).length+' тем'}</button>`).join('')}</div><div class="section-title"><h2>${onlyFav?'Избранные параграфы':activeChapter?'Параграфы выбранной главы':'Список параграфов'}</h2><small>${items.length} тем · выбери нужную карточку</small></div><div class="grid-list">${items.map(card).join('')||'<div class="empty">Ничего не найдено. Попробуй изменить поиск или выбрать другую главу.</div>'}</div><div class="footer-note">Нумерация и заголовки сохранены по загруженному учебнику. Парные разделы объединены так же, как в книге. Пересказы и ответы сформулированы своими словами для повторения.</div>`;$('view').innerHTML=html;document.querySelectorAll('.section-card').forEach(b=>b.addEventListener('click',()=>openSection(b.dataset.id)));document.querySelectorAll('[data-chapter]').forEach(b=>b.addEventListener('click',()=>{activeChapter=Number(b.dataset.chapter);renderHome();}));}
function renderPairs(arr){if(!arr||!arr.length)return '<div class="empty">В этом блоке не найдено соответствующего задания.</div>';return `<div class="qa-list">${arr.map((v,i)=>`<details class="qa-item"><summary>${esc(v[0])}</summary><div class="answer">${esc(v[1])}</div></details>`).join('')}</div>`;}
function renderTab(x){if(tab==='short')return `<div class="content-panel"><h2>Краткий пересказ</h2><p>${esc(x.short)}</p><div class="answer-main"><b>Главный вывод</b><p>${esc(x.main)}</p></div></div>`;
if(tab==='points')return `<div class="content-panel"><h2>Пересказ по пунктам учебника</h2>${x.outline?`<div class="outline-list">${x.outline.map(p=>`<article class="point-card"><div class="point-number">${p.num}</div><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></article>`).join('')}</div>`:`<ol class="points">${x.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>`}<div class="answer-main"><b>Главный вывод</b><p>${esc(x.main)}</p></div></div>`;
if(tab==='qa')return `<div class="content-panel"><h2>Ответы на вопросы и задания</h2><p style="font-size:12px;color:var(--muted)">Ответы сформулированы по материалу соответствующего раздела учебника.</p>${renderPairs(x.qa)}</div>`;
if(tab==='source')return `<div class="content-panel"><h2>Работа с историческим источником</h2><div class="source-box"><div class="source-label">Источник из учебника</div><h3>${esc(x.src.split('. ')[0])}</h3><p>${esc(x.src)}</p></div><h2 style="font-size:15px">Вопросы к источнику</h2>${renderPairs(x.srcq)}</div>`;
if(tab==='terms')return `<div class="content-panel"><h2>Работа с понятиями</h2><div class="term-grid">${x.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></div>`).join('')}</div></div>`;
return `<div class="content-panel"><h2>Хронология и основные даты</h2><ul class="date-list">${x.dates.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`;}
function renderSection(x){current=x;tab='short';const isFav=favorites.has(x.id);$('view').innerHTML=`<button class="home-link" id="back">← К списку параграфов</button><div class="paragraph-head"><div class="crumb">Главная / ${esc(x.chapter_name)} / ${esc(x.n)}</div><h1>${esc(x.t)}</h1><div class="para-meta"><span class="meta-tag">${esc(x.n)}</span><span class="meta-tag">Страницы учебника: ${esc(x.pg)}</span><span class="meta-tag">${x.qa.length} ответов</span><span class="meta-tag">${esc(x.chapter_name)}</span></div></div><div class="main-question"><b>Главный вопрос темы</b><p>${esc(x.main)}</p></div><div class="tabs">${TABS.map(([id,label])=>`<button class="tab ${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</div><div id="tabContent">${renderTab(x)}</div><div class="para-footer"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="studyBtn">${studied.has(x.id)?'✓ Изучено':'Отметить как изученное'}</button><button class="btn small" id="favoriteBtn">${isFav?'★ В избранном':'☆ В избранное'}</button></div><button class="btn small" id="nextBtn">Следующий параграф →</button></div><div class="footer-note">Структура раздела соответствует учебнику. Ответы — учебные формулировки своими словами. Для заданий на карте, иллюстрации и дополнительных материалов используй также соответствующие изображения и страницы PDF.</div>`;
$('back').addEventListener('click',renderHome);document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(z=>z.classList.toggle('active',z.dataset.tab===tab));$('tabContent').innerHTML=renderTab(x);}));
$('studyBtn').addEventListener('click',()=>{if(studied.has(x.id))studied.delete(x.id);else studied.add(x.id);save();renderSection(x);toast(studied.has(x.id)?'Параграф отмечен как изученный':'Отметка снята');});
$('favoriteBtn').addEventListener('click',()=>{if(favorites.has(x.id))favorites.delete(x.id);else favorites.add(x.id);save();renderSection(x);toast(favorites.has(x.id)?'Добавлено в избранное':'Удалено из избранного');});
$('nextBtn').addEventListener('click',()=>{const ix=DATA.findIndex(d=>d.id===x.id);openSection(DATA[(ix+1)%DATA.length].id);});}
function openSection(id){const x=DATA.find(d=>d.id===id);if(!x)return;$('loader').classList.add('show');setTimeout(()=>{$('loader').classList.remove('show');renderSection(x);$('main').scrollIntoView({behavior:'smooth',block:'start'});},420);}
$('search').addEventListener('input',()=>{if(!current)renderHome();else if(!visibleData().some(x=>x.id===current.id)){renderHome();}});
$('homeBtn').addEventListener('click',()=>{onlyFav=false;activeChapter=0;renderHome();});
$('allBtn').addEventListener('click',()=>{onlyFav=false;activeChapter=0;$('search').value='';renderHome();});
$('favBtn').addEventListener('click',()=>{onlyFav=!onlyFav;activeChapter=0;$('favBtn').textContent=onlyFav?'★ Избранное включено':'☆ Избранное';renderHome();});
renderHome();
</script>
</body>
</html>
